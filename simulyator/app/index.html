<style>
/* Раскладка: слева код, справа вид детали, под ним лента воспроизведения и вкладки с данными.
   Палитра: холодный графит, бирюзовый акцент для интерфейса; красный/синий/фиолетовый зарезервированы за типами траектории. */
:root {
  --bg: #e9edf0; --panel: #ffffff; --panel2: #f3f6f8; --line: #d2d9df;
  --fg: #1a2430; --muted: #5a6978; --accent: #0b7a75; --accent-fg: #ffffff;
  --bad: #c62f2f; --warn: #a96a00; --ok: #23824f;
  --rapid: #d94141; --thread: #8e44ad;
  --view-bg: #f7f9fb; --view-grid: #e2e7eb;
  --stock-top: #b8c1cb; --stock-deep: #5f8fbb; --stock-side: #8a95a2;
  --code-bg: #fbfcfd; --code-gutter: #eef1f4; --hl: rgba(11,122,117,.16); --hl-err: rgba(198,47,47,.13);
  --sans: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', Consolas, 'Cascadia Mono', 'Courier New', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419; --panel: #172028; --panel2: #1c262f; --line: #2a3640;
    --fg: #dde5ec; --muted: #8a99a8; --accent: #3cc7b8; --accent-fg: #06201c;
    --bad: #ff6f6f; --warn: #e8b14a; --ok: #62d394;
    --rapid: #ff6b6b; --thread: #c58bf0;
    --view-bg: #0b1015; --view-grid: #19222a;
    --stock-top: #9aa6b3; --stock-deep: #4d86bb; --stock-side: #566272;
    --code-bg: #111920; --code-gutter: #162029; --hl: rgba(60,199,184,.17); --hl-err: rgba(255,111,111,.15);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1419; --panel: #172028; --panel2: #1c262f; --line: #2a3640;
  --fg: #dde5ec; --muted: #8a99a8; --accent: #3cc7b8; --accent-fg: #06201c;
  --bad: #ff6f6f; --warn: #e8b14a; --ok: #62d394;
  --rapid: #ff6b6b; --thread: #c58bf0;
  --view-bg: #0b1015; --view-grid: #19222a;
  --stock-top: #9aa6b3; --stock-deep: #4d86bb; --stock-side: #566272;
  --code-bg: #111920; --code-gutter: #162029; --hl: rgba(60,199,184,.17); --hl-err: rgba(255,111,111,.15);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 13.5px/1.4 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; min-height: 0; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: 6px; }
.brand b { font-size: 16px; font-weight: 600; letter-spacing: .01em; }
.brand small { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 6px 14px; font-weight: 500; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-fg); }
.grow { flex: 1 1 auto; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 11px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
select.btn { padding-right: 6px; max-width: 280px; }

.work { display: grid; grid-template-columns: minmax(300px, 33%) minmax(0, 1fr); gap: 10px; min-height: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; min-height: 0; }

/* редактор */
.editor { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: clip; }
.ed-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--panel2); font-size: 12px; color: var(--muted); }
.ed-head b { color: var(--fg); font-weight: 600; font-family: var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-head > span { white-space: nowrap; }
.ed-head .grow { flex: 1 0 8px; }
.ed { position: relative; overflow: clip; min-height: 0; background: var(--code-bg); font: 12.5px/20px var(--mono); }
.gutter { position: absolute; left: 0; top: 0; bottom: 0; width: 50px; overflow: hidden; background: var(--code-gutter); border-right: 1px solid var(--line); color: var(--muted); text-align: right; user-select: none; }
.gutter div { height: 20px; padding-right: 8px; position: relative; }
.gutter div.e::before, .gutter div.w::before { content: ''; position: absolute; left: 7px; top: 7px; width: 6px; height: 6px; border-radius: 50%; }
.gutter div.e::before { background: var(--bad); } .gutter div.w::before { background: var(--warn); }
.hl { position: absolute; left: 50px; right: 0; top: 0; bottom: 0; overflow: hidden; pointer-events: none; }
.hl > div { position: absolute; left: 0; right: 0; height: 20px; }
.hl .cur { background: var(--hl); border-left: 3px solid var(--accent); }
.hl .err { background: var(--hl-err); }
#code { position: absolute; left: 50px; right: 0; top: 0; bottom: 0; width: calc(100% - 50px); height: 100%; margin: 0; padding: 0 10px; border: 0; background: transparent; resize: none; white-space: pre; overflow: auto; tab-size: 4; font: inherit; line-height: 20px; color: var(--fg); outline: none; }
.ed-foot { padding: 6px 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; background: var(--panel2); }

/* сцена */
.stage { display: grid; grid-template-rows: auto minmax(220px, 1fr) auto auto minmax(150px, 262px); gap: 8px; min-height: 0; background: transparent; border: 0; }
.viewbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.viewbar .grp { display: inline-flex; gap: 4px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 4px 9px; font-size: 12.5px; }
.chip.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.chk input { accent-color: var(--accent); margin: 0; }
.vwrap { position: relative; overflow: hidden; min-height: 0; background: var(--view-bg); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.vwrap canvas { position: absolute; inset: 0; }
#gl { pointer-events: none; visibility: hidden; }
#cv { z-index: 1; }
.legend { position: absolute; right: 8px; top: 8px; display: flex; gap: 10px; background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
.legend i.dash { border-top-style: dashed; }
.hint { position: absolute; left: 8px; top: 7px; max-width: 55%; font-size: 11.5px; color: var(--muted); pointer-events: none; }

.transport { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 8px 10px; }
.tbtn { width: 36px; height: 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.tbtn:hover { border-color: var(--accent); }
.tbtn.play { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); width: 44px; }
.tbtn svg { width: 15px; height: 15px; fill: currentColor; }
#prog { flex: 1 1 200px; min-width: 120px; accent-color: var(--accent); }
.speed { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
.speed select { border: 1px solid var(--line); background: var(--panel2); border-radius: 5px; padding: 4px 4px; }

.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); overflow: hidden; }
.readout > div { padding: 6px 10px; min-width: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.readout span { display: block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.readout b { display: block; font: 600 14px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.readout .blk { grid-column: span 2; }

/* вкладки */
.panel { display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--panel2); }
.tabs button { border: 0; background: transparent; padding: 7px 13px; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); background: var(--panel); }
.tabs .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px; font-size: 11px; line-height: 17px; text-align: center; background: var(--line); color: var(--fg); }
.tabs .badge.e { background: var(--bad); color: #fff; } .tabs .badge.w { background: var(--warn); color: #fff; }
.tabbody { overflow: auto; padding: 10px 12px; min-height: 0; }
.msg { display: grid; grid-template-columns: 18px 56px 1fr; gap: 8px; padding: 5px 4px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: baseline; }
.msg:hover { background: var(--panel2); }
.msg .ic { width: 10px; height: 10px; border-radius: 50%; align-self: center; }
.msg.e .ic { background: var(--bad); } .msg.w .ic { background: var(--warn); } .msg.i .ic { background: var(--muted); }
.msg .ln { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); padding: 8px 2px; }
.empty b { color: var(--ok); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; padding: 4px 8px 4px 0; }
td { padding: 3px 8px 3px 0; vertical-align: middle; }
td input, td select { width: 100%; max-width: 130px; border: 1px solid var(--line); background: var(--panel2); border-radius: 4px; padding: 3px 6px; font-family: var(--mono); font-size: 12.5px; }
td input[type=number] { max-width: 84px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 22px; }
.fld { display: grid; grid-template-columns: 1fr 76px; gap: 4px 8px; align-items: center; }
.fld label { color: var(--muted); font-size: 12.5px; }
.fld input[type=number], .fld select { border: 1px solid var(--line); background: var(--panel2); border-radius: 4px; padding: 3px 6px; font-family: var(--mono); font-size: 12.5px; width: 100%; }
.fld.wide { grid-template-columns: 1fr 130px; }
h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.note { color: var(--muted); font-size: 12px; margin-top: 6px; }
.stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
.stat div { border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; background: var(--panel2); }
.stat span { display: block; font-size: 11px; color: var(--muted); }
.stat b { font: 600 15px var(--mono); }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; }
  .work { grid-template-columns: 1fr; }
  .editor { height: 340px; }
  .stage { grid-template-rows: auto 56vh auto auto auto; }
  .panel { height: 300px; }
  .hint { display: none; }
  .readout .blk { grid-column: span 1; }
}

/* окно отправки на станок */
.mdl-back { position: fixed; inset: 0; background: rgba(10,16,22,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.mdl { width: min(640px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.3); }
.mdl-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel2); border-radius: 10px 10px 0 0; }
.mdl-h b { font-size: 15px; } .mdl-h .x { margin-left: auto; border: 0; background: transparent; font-size: 20px; line-height: 1; color: var(--muted); }
.mdl-b { padding: 14px 16px; display: grid; gap: 10px; }
.mdl-row { display: grid; grid-template-columns: 120px 1fr; gap: 8px; align-items: center; }
.mdl-row label { color: var(--muted); font-size: 12.5px; }
.mdl-row select, .mdl-row input { border: 1px solid var(--line); background: var(--panel2); border-radius: 5px; padding: 6px 8px; font-family: var(--mono); font-size: 13px; width: 100%; }
.mdl-note { font-size: 12px; color: var(--muted); }
.mdl-warn { font-size: 12.5px; color: var(--warn); }
.mdl-bar { height: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.mdl-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.mdl-log { font: 12px/1.45 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 150px; overflow: auto; white-space: pre-wrap; }
.mdl-log .ok { color: var(--ok); } .mdl-log .bad { color: var(--bad); }
.mdl-br { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.mdl-br-h { display: flex; gap: 6px; align-items: center; padding: 6px 8px; background: var(--panel2); border-bottom: 1px solid var(--line); }
.mdl-br-h code { font: 12.5px var(--mono); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mdl-br-l { max-height: 240px; overflow: auto; }
.mdl-br-l .it { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center; padding: 5px 10px; border-bottom: 1px solid var(--line); font: 12.5px var(--mono); }
.mdl-br-l .it.d { cursor: pointer; } .mdl-br-l .it.d:hover { background: var(--hl); }
.mdl-br-l .it.f { color: var(--muted); } .mdl-br-l .it.same { color: var(--warn); font-weight: 600; }
.mdl-br-l .it small { color: var(--muted); font-family: var(--sans); }
.mdl-br-l .msg2 { padding: 10px; color: var(--muted); font-size: 12.5px; }
.mdl-in { display: flex; gap: 6px; } .mdl-in input { flex: 1; }
.mdl-f { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.mdl-f .grow { flex: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      <b>Симулятор УП</b><small>Fanuc iO · G-код</small><small id="appVer" title="Изменения версии 9.0 (20.10.2026):
• Новый расчёт материала как во Fusion (три-дексель: лучи по Z, X и Y) — стенки, цилиндр, канавки ровные и гладкие, без ступенек и полос
• Затенение во впадинах и углах (ambient occlusion), острые рёбра, свет привязан к камере, отражение на металле
• «По операциям» и «по инструменту»: стенка окрашивается той операцией, которая её прошла
• Кнопка «в конец» не пересчитывает программу заново
Версия 8.9:
• Вид как в симуляции Fusion 360: градиентный фон, металл заготовки серый с бликом, траектория по типам движений (синий — резание, жёлтый — G0, зелёный — подвод/отвод, красный — врезание), пройденная часть яркая, оставшаяся приглушена
• Инструмент рисуется объёмно: фреза, хвостовик, патрон
• Окраска заготовки: «металл», «по операциям» (названия операций из комментариев Fusion), по инструменту, по глубине, сравнение с моделью
• Сравнение с моделью STL в цветах Fusion: красный — зарез, зелёный — в допуске, синий — недоснято; полупрозрачная модель поверх
Версия 8.8:
• 3D-модель материала (дисковая фреза, разрез, наклон) рисуется гладкой поверхностью вместо квадратных столбиков: ровная кромка круга, без полос на стенках, канавка видна
• Цвета остатка на стенках привязаны к правильному столбику металла (без жёлто-зелёных полос)
Версия 8.7:
• Новая 3D-графика (WebGL): освещение, буфер глубины, сетка заготовки мельче (разрешение «Высокое» по умолчанию)
• «Заготовка: остаток по модели» — загрузите STL детали из Fusion: зелёный — в допуске, жёлтый/оранжевый — недоснятый металл, серо-синий — больше 2 мм, красный — зарез
• «Заготовка: по инструменту» — каким инструментом снят металл
Версия 8.6:
• Дисковая (пазовая) фреза: режет только диск заданной ширины, канавки под стенкой (поднутрения) считаются 3D-моделью; проверка шейки на задевание
• Разрез заготовки (по XZ или YZ) — видно канавки и стенки внутри
• Исправлено: при первом открытии УП коррекция G41/G42 бралась с радиусом от прошлой таблицы инструмента (траектория чистовых шла не там)
• Сообщение, если файл сделан демонстрационным постпроцессором Fusion
Версия 8.5:
• Форма заготовки для фрезерной: авто по программе, прямоугольник или круг (цилиндр); круг можно задать и комментарием (ZAGOTOVKA D120 H30)
• Коррекция G41/G42: оранжевым пунктиром показан контур детали из программы; на вкладке «Станок» выбор — в программе контур детали (D = радиус) или центр фрезы (D = износ, Fusion «Износ»)
• Угол фасочной фрезы из Fusion (TAPER=45DEG) теперь читается как 90° при вершине
Версия 8.4.1:
• Ярлыки берут иконку из самой программы, при установке кеш иконок Windows обновляется
Версия 8.4:
• Новая иконка программы
Версия 8.3:
• Перед отправкой папка на стойке проверяется: если программа с таким номером уже есть — сразу предлагается замена (раньше стойка отвечала кодом 5)
• Папка, открытая в «Обзоре», сразу становится папкой отправки
• При отказе стойки показывается, на какой строке он произошёл, и подробный код ошибки
Версия 8.2:
• Кнопка «Обзор…»: папка на стойке выбирается из списка (диски, папки, программы со стойки), как в STZ & FANUC LAN
• Если программа с таким номером уже есть в папке — она подсвечивается
Версия 8.1:
• Исправлена ошибка «код −8» при отправке на станок: все вызовы FOCAS идут из одного потока, как в STZ & FANUC LAN

<script>
'use strict';
/* ================================================================
   ЯДРО: макро-выражения Fanuc, разбор кадров
   ================================================================ */
const D2R = Math.PI / 180;
const hyp = Math.hypot;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f3 = v => (Math.round(v * 1000) / 1000).toString();

class VarStore {
  constructor(ip) { this.ip = ip; this.m = new Map(); }
  get(n) {
    n = Math.round(n);
    const p = this.ip.pos;
    if (n === 5041 || n === 5021) return p.x;
    if (n === 5042 || n === 5022) return p.y;
    if (n === 5043 || n === 5023) return p.z;
    return this.m.has(n) ? this.m.get(n) : 0;
  }
  set(n, v) {
    n = Math.round(n);
    if (n === 3000) throw new Error('Аварийный останов макросом #3000=' + v);
    this.m.set(n, v);
  }
}

const MFUNCS = {
  SIN: a => Math.sin(a * D2R), COS: a => Math.cos(a * D2R), TAN: a => Math.tan(a * D2R),
  ASIN: a => Math.asin(a) / D2R, ACOS: a => Math.acos(a) / D2R,
  SQRT: Math.sqrt, ABS: Math.abs, LN: Math.log, EXP: Math.exp,
  ROUND: a => Math.round(a), FIX: Math.floor, FUP: Math.ceil,
  BIN: a => a, BCD: a => a
};

function macroEval(src, vars) {
  const s = src.replace(/\s+/g, '').toUpperCase();
  let i = 0;
  const peek = () => { const m = /^[A-Z]+/.exec(s.slice(i)); return m ? m[0] : ''; };
  const expect = ch => { if (s[i] !== ch) throw new Error('В выражении «' + src + '» ожидалась ' + ch); i++; };
  function primary() {
    const c = s[i];
    if (c === '+') { i++; return primary(); }
    if (c === '-') { i++; return -primary(); }
    if (c === '[') { i++; const v = cmp(); expect(']'); return v; }
    if (c === '#') {
      i++;
      let idx;
      if (s[i] === '[') { i++; idx = cmp(); expect(']'); }
      else {
        const m = /^\d+/.exec(s.slice(i));
        if (!m) throw new Error('Неверный номер переменной в «' + src + '»');
        i += m[0].length; idx = +m[0];
      }
      return vars.get(idx);
    }
    const m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
    if (m) { i += m[0].length; return parseFloat(m[0]); }
    const w = peek();
    if (w && MFUNCS[w]) {
      i += w.length; expect('[');
      const a = cmp(); expect(']');
      if (w === 'ATAN') {
        let b = 1;
        if (s[i] === '/' && s[i + 1] === '[') { i += 2; b = cmp(); expect(']'); }
        return Math.atan2(a, b) / D2R;
      }
      return MFUNCS[w](a);
    }
    throw new Error('Не удалось разобрать выражение «' + src + '»');
  }
  function mul() {
    let a = primary();
    for (;;) {
      const c = s[i];
      if (c === '*') { i++; a *= primary(); }
      else if (c === '/') { i++; a /= primary(); }
      else {
        const w = peek();
        if (w === 'MOD') { i += 3; const b = primary(); a = a % b; }
        else if (w === 'AND') { i += 3; const b = primary(); a = (a && b) ? 1 : 0; }
        else return a;
      }
    }
  }
  function add() {
    let a = mul();
    for (;;) {
      const c = s[i];
      if (c === '+') { i++; a += mul(); }
      else if (c === '-') { i++; a -= mul(); }
      else {
        const w = peek();
        if (w === 'OR') { i += 2; const b = mul(); a = (a || b) ? 1 : 0; }
        else if (w === 'XOR') { i += 3; const b = mul(); a = (!a !== !b) ? 1 : 0; }
        else return a;
      }
    }
  }
  function cmp() {
    const a = add();
    const w = peek();
    if (['EQ', 'NE', 'GT', 'LT', 'GE', 'LE'].includes(w)) {
      i += 2;
      const b = add();
      switch (w) {
        case 'EQ': return Math.abs(a - b) < 1e-9 ? 1 : 0;
        case 'NE': return Math.abs(a - b) >= 1e-9 ? 1 : 0;
        case 'GT': return a > b ? 1 : 0;
        case 'LT': return a < b ? 1 : 0;
        case 'GE': return a >= b - 1e-9 ? 1 : 0;
        default: return a <= b + 1e-9 ? 1 : 0;
      }
    }
    return a;
  }
  const r = cmp();
  if (i < s.length) throw new Error('Лишние символы в выражении «' + src + '»');
  return r;
}

function matchBracket(s, i) {
  let d = 0;
  for (let j = i; j < s.length; j++) {
    if (s[j] === '[') d++;
    else if (s[j] === ']') { d--; if (d === 0) return j; }
  }
  throw new Error('Не закрыта скобка [');
}

function parseWords(s) {
  const w = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (!/[A-Z]/.test(c)) throw new Error('Неожиданный символ «' + c + '»');
    i++;
    let j = i;
    if (s[j] === '-' || s[j] === '+') j++;
    if (s[j] === '[') j = matchBracket(s, j) + 1;
    else if (s[j] === '#') {
      j++;
      if (s[j] === '[') j = matchBracket(s, j) + 1;
      else while (j < s.length && /\d/.test(s[j])) j++;
    } else while (j < s.length && /[\d.]/.test(s[j])) j++;
    const raw = s.slice(i, j);
    if (!raw || raw === '-' || raw === '+') throw new Error('Слово ' + c + ' без значения');
    w.push({ c, raw });
    i = j;
  }
  return w;
}

function parseLine(raw, idx) {
  const L = { i: idx, raw, n: null, kind: 'blank', words: [], comment: '' };
  let s = raw.replace(/\(([^)]*)\)/g, (m, c) => { L.comment += c + ' '; return ''; });
  const sc = s.indexOf(';');
  if (sc >= 0) { L.comment += s.slice(sc + 1); s = s.slice(0, sc); }
  s = s.replace(/\s+/g, '').toUpperCase();
  if (s[0] === '/') s = s.slice(1);
  if (!s || s === '%') return L;
  try {
    let m;
    if ((m = /^O(\d+)/.exec(s))) { L.kind = 'prog'; L.pid = +m[1]; return L; }
    if ((m = /^N(\d+)/.exec(s))) { L.n = +m[1]; s = s.slice(m[0].length); }
    if (!s) return L;
    L.s = s;
    if (s[0] === '#') {
      const eq = s.indexOf('=');
      if (eq < 0) throw new Error('Присваивание без =');
      L.kind = 'assign'; L.lhs = s.slice(0, eq); L.rhs = s.slice(eq + 1);
    } else if (s.startsWith('IF[')) {
      const j = matchBracket(s, 2), rest = s.slice(j + 1);
      L.kind = 'if'; L.cond = s.slice(2, j + 1);
      let mm;
      if ((mm = /^GOTO(\d+)$/.exec(rest))) L.go = +mm[1];
      else if (rest.startsWith('THEN')) L.then = rest.slice(4);
      else throw new Error('После IF[...] ожидается GOTO или THEN');
    } else if (s.startsWith('WHILE[')) {
      const j = matchBracket(s, 5), rest = s.slice(j + 1);
      const mm = /^DO(\d+)$/.exec(rest);
      if (!mm) throw new Error('После WHILE[...] ожидается DOn');
      L.kind = 'while'; L.cond = s.slice(5, j + 1); L.label = +mm[1];
    } else if ((m = /^END(\d+)$/.exec(s))) { L.kind = 'end'; L.label = +m[1]; }
    else if ((m = /^GOTO(\d+)$/.exec(s))) { L.kind = 'goto'; L.go = +m[1]; }
    else { L.kind = 'words'; L.words = parseWords(s); }
  } catch (e) { L.kind = 'bad'; L.err = e.message; }
  return L;
}

function compileProgram(src) {
  const raw = src.split(/\r?\n/);
  const progs = [];
  let cur = { id: null, lines: [] };
  progs.push(cur);
  raw.forEach((t, i) => {
    const L = parseLine(t, i);
    if (L.kind === 'prog') {
      if (cur.lines.every(x => x.kind === 'blank') && cur.id === null) { cur.id = L.pid; cur.lines.push(L); return; }
      cur = { id: L.pid, lines: [L] }; progs.push(cur); return;
    }
    cur.lines.push(L);
  });
  const real = progs.filter(p => p.lines.some(x => x.kind !== 'blank'));
  const subs = new Map();
  real.forEach(p => { if (p.id !== null) subs.set(p.id, p); });
  return { main: real[0] || progs[0], subs, all: real };
}

/* ---------- инструмент из текста УП ----------
   Читает комментарии: (T1 - FREZA KONCEVAYA D10 Z4), Fusion: (T1  D=10. CR=0. - ZMIN=-12. - FLAT END MILL),
   комментарий в строке со сменой инструмента или строкой выше. */
function parseToolText(text) {
  const h = { text: text.trim() };
  const t = ' ' + text.replace(/,/g, '.') + ' ';
  const up = t.toUpperCase();
  let m = null;
  const dre = /(?<![A-ZА-Я0-9])(?:D|DIA|DIAM|ДИАМ\w*|ДИА|Ø|⌀)\s*[=:]?\s*(\d+(?:\.\d+)?)/gi;
  while ((m = dre.exec(t))) { const v = parseFloat(m[1]); if (v > 0) { h.d = v; break; } else if (h.d === undefined) h.d = 0; }
  m = /(?<![A-ZА-Я])CR\s*=?\s*(\d+(?:\.\d+)?)/i.exec(t);
  if (m) h.cr = parseFloat(m[1]);
  m = /(?:ANGLE|TAPER|UGOL|УГОЛ|ВЕРШИН\w*|TIP)\s*[=:]?\s*(\d{2,3})/i.exec(t) || /(\d{2,3})\s*(?:°|DEG|GRAD|ГРАД)/i.exec(t);
  if (m) h.tip = /TAPER/i.test(m[0]) ? 2 * parseFloat(m[1]) : parseFloat(m[1]);
  m = /(?:LCF|FLUTE|LF|РЕЖ\w*|CUT\s*LEN\w*)\s*[=:]?\s*(\d+(?:\.\d+)?)/i.exec(t);
  if (m) h.lf = parseFloat(m[1]);
  m = /(?:(?<![A-Z])(?:W|B|SW)|ШИР\w*|THICK\w*|TOLSH\w*|ТОЛЩ\w*)\s*=\s*(\d+(?:\.\d+)?)/i.exec(t);
  if (m) h.w = parseFloat(m[1]);
  m = /(?:(?<![A-Z])(?:DS|SHANK|NECK|SHAFT)|ШЕЙК\w*|ХВОСТ\w*)\s*=\s*(\d+(?:\.\d+)?)/i.exec(t);
  if (m) h.ds = parseFloat(m[1]);
  m = /(?<![A-Z])NR\s*=?\s*(\d+(?:\.\d+)?)/i.exec(t);
  if (m) h.nr = parseFloat(m[1]);
  const T = k => k.test(up);
  if (T(/ZHIV|LIVE|ЖИВ/)) h.live = T(/RADIAL|РАДИАЛ|BOK|БОК|SIDE/) ? 'live_rad' : 'live_ax';
  if (T(/BALL|SHAR|ШАР|СФЕР/)) h.type = 'ball';
  else if (T(/SPOT|CENTR|CENTER|ЦЕНТР|NACHAL/)) h.type = 'spot';
  else if (T(/DRILL|SVERL|СВЕРЛ/)) h.type = 'drill';
  else if (T(/CHAMFER|FASK|ФАСК/)) h.type = 'chamfer';
  else if (T(/SLOT\s*MILL|SLOTTING|DISC|DISK|KEYSEAT|WOODRUFF|T-?SLOT|ДИСК|ПАЗОВ\w*\s*ДИСК|DISKOV|ДИСКОВ/)) h.type = 'slot';
  else if (T(/BULL|TORIC|\bTOR\b|ТОР/) || (h.cr > 0 && T(/MILL|FREZ|ФРЕЗ|END/))) h.type = 'bull';
  else if (T(/\bTAP\b|METCH|МЕТЧ/)) h.type = 'tap';
  else if (T(/FACE\s*MILL|TORCEV\w*\s*FREZ|ТОРЦЕВ\w*\s*ФРЕЗ/)) h.type = 'face';
  else if (T(/BORING|RASTOCH|РАСТОЧ|ВНУТР/)) h.type = T(/MILL|FREZ|ФРЕЗ/) ? 'bore' : 'int';
  else if (T(/GROOV|KANAV|КАНАВ|ОТРЕЗ|PARTING/)) h.type = 'groove';
  else if (T(/THREAD|REZB|РЕЗЬБ/)) h.type = 'thread';
  else if (T(/FLAT|KONCEV|КОНЦЕВ|END\s*MILL|ENDMILL|FREZ|ФРЕЗ|MILL/)) h.type = 'flat';
  if (h.type === 'ball' && h.d === undefined) { const r = /(?<![A-Z])R\s*=?\s*(\d+(?:\.\d+)?)/i.exec(t); if (r) h.d = 2 * parseFloat(r[1]); }
  if (h.d === undefined) { const r = /(\d+(?:\.\d+)?)\s*(?:MM|ММ)\b/i.exec(t); if (r) h.d = parseFloat(r[1]); }
  return h;
}
function mergeHint(a, b) { for (const k in b) if (a[k] === undefined) a[k] = b[k]; return a; }

function scanToolHints(src) {
  const hints = {};
  const add = (no, h) => { hints[no] = hints[no] ? mergeHint(hints[no], h) : h; };
  let pending = [];
  for (const raw of src.split(/\r?\n/)) {
    const comments = [];
    let code = raw.replace(/\(([^)]*)\)/g, (m, c) => { comments.push(c); return ' '; });
    const sc = code.indexOf(';'); if (sc >= 0) { comments.push(code.slice(sc + 1)); code = code.slice(0, sc); }
    const cu = code.toUpperCase().replace(/\s+/g, '').replace(/^N\d+/, '');
    const tm = /(?:^|[A-Z])T(\d{1,4})(?!\d)/.exec(cu);
    let tno = null;
    if (tm && !/^\d/.test(cu)) { const dg = tm[1]; tno = dg.length >= 3 ? parseInt(dg.slice(0, dg.length - 2), 10) : parseInt(dg, 10); }
    for (const c of comments) {
      const mm = /^[\s\-=*#.]*(?:T|TOOL|ИНСТР\w*|ПОЗ\w*)\s*[:#]?\s*0?(\d{1,2})(?:\d{2})?(?!\d)[\s:.\-=]*(.*)$/i.exec(c);
      if (mm) { add(parseInt(mm[1], 10), parseToolText(mm[2] || '')); continue; }
      if (tno !== null) add(tno, parseToolText(c));
      else if (cu === '') pending.push(c);
    }
    if (cu !== '') {
      if (tno !== null && pending.length) add(tno, parseToolText(pending.slice(-3).join(' ')));
      pending = [];
    }
  }
  scanLive(src, hints);
  return hints;
}

/* Живой инструмент токарной: вращение шпинделя инструмента (M3/M4 ... P12) или позиционирование по C
   при вызванном инструменте. Осевой или радиальный — по преобладающему движению рабочих подач. */
function scanLive(src, hints) {
  let cur = null, mode = 0;
  const st = {};
  for (const raw of src.split(/\r?\n/)) {
    const cu = raw.replace(/\([^)]*\)/g, ' ').replace(/;.*$/, '').toUpperCase().replace(/\s+/g, '').replace(/^N\d+/, '');
    if (!cu) continue;
    const tm = /(?:^|[A-Z])T(\d{3,4})(?!\d)/.exec(cu);
    if (tm) { cur = parseInt(tm[1].slice(0, tm[1].length - 2), 10); st[cur] = st[cur] || { live: false, c: false, x: 0, z: 0 }; mode = 0; continue; }
    if (cur === null) continue;
    const e = st[cur];
    if (/M0?[34].*P12(?!\d)/.test(cu)) e.live = true;
    if (/(^|[A-Z0-9.])C-?\d/.test(cu) && !/G28/.test(cu)) e.c = true;

/* ================================================================
   ИНТЕРПРЕТАТОР Fanuc (фрезерная / токарная)
   Результат: список движений в координатах станка + предупреждения

const PLANES = { 17: [0, 1, 2], 18: [2, 0, 1], 19: [1, 2, 0] };
const PLANE_IJK = { 17: ['I', 'J'], 18: ['K', 'I'], 19: ['J', 'K'] };

function arcPoints(a0, b0, a1, b1, ca, cb, cw, c0, c1) {
  const r0 = hyp(a0 - ca, b0 - cb), r1 = hyp(a1 - ca, b1 - cb);
  const th0 = Math.atan2(b0 - cb, a0 - ca), th1 = Math.atan2(b1 - cb, a1 - ca);
  let d = th1 - th0;
  const full = hyp(a1 - a0, b1 - b0) < 1e-7;
  if (cw) { while (d >= -1e-9) d -= 2 * Math.PI; if (!full && d < -2 * Math.PI) d += 2 * Math.PI; }

  const n = clamp(Math.ceil(Math.abs(d) / Math.max(step, 0.01)), 6, 900);

  for (let k = 0; k <= n; k++) {
    const t = k / n, th = th0 + d * t, r = r0 + (r1 - r0) * t;
    out.push([ca + r * Math.cos(th), cb + r * Math.sin(th), c0 + (c1 - c0) * t]);
  }
  out[out.length - 1] = [a1, b1, c1];

}

class Interp {

  result() {

  rapid(x, y, z, tag) { this.lineTo('R', { x: x === undefined ? this.pos.x : x, y: y === undefined ? this.pos.y : y, z: z === undefined ? this.pos.z : z }, tag); }
  feed(x, y, z, tag, kind) { this.lineTo(kind || 'F', { x: x === undefined ? this.pos.x : x, y: y === undefined ? this.pos.y : y, z: z === undefined ? this.pos.z : z }, tag); }

  arcMove(tgt, cw, A, kind, tag) {
