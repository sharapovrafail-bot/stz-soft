      const [la, lb] = PLANE_IJK[this.plane];
      if (A[la] === undefined && A[lb] === undefined) { this.err('Дуга без I/J/K и без R', this.curLine); this.lineTo('F', tgt, tag); return; }
      ca = a0 + (A[la] || 0); cb = b0 + (A[lb] || 0);
    }
    const res = arcPoints(a0, b0, a1, b1, ca, cb, cw, Q0[ic], Q1[ic]);
    if (Math.abs(res.r0 - res.r1) > 0.02) this.warn('Радиусы дуги в начале и конце различаются на ' + f3(Math.abs(res.r0 - res.r1)) + ' мм (на станке будет авария P/S 0020)', this.curLine);
    const wo = this.offv();
    const pts = res.pts.map(q => {
      const P = [0, 0, 0]; P[ia] = q[0]; P[ib] = q[1]; P[ic] = q[2];
      return [P[0] / sx + wo.x, P[1] + wo.y, P[2] + wo.z];
    });
    pts[0] = this.toM(this.pos);
    if (!lathe && this.rotActive()) {
      const ps = [], ds = [];
      for (const q of res.pts) {
        const P = [0, 0, 0]; P[ia] = q[0]; P[ib] = q[1]; P[ic] = q[2];
        const o = this.poseOf({ x: P[0], y: P[1], z: P[2], b: this.ab, c: this.ac });
        ps.push(o.pt); ds.push(o.dir);
      }
      this.emit(kind || 'F', ps, tag, { dirs: ds });
    } else if (lathe && (this.ac || this.o.toolKind)) {
      const cs = pts.map(() => this.ac);
      this.emit(kind || 'F', pts, tag, { cs: this.ac ? cs : undefined, dirs: this.liveDirs(cs) });
    } else if (this.useComp()) this.compSeg(kind || 'F', pts, tag);
    else this.emit(kind || 'F', pts, tag);
    this.pos = { x: tgt.x, y: tgt.y, z: tgt.z };
  }

  /* ---------- один кадр ---------- */
  execBlock(L, opt) {
    opt = opt || {};
    this.L = L; this.curLine = L.i;
    const lathe = this.lathe;
    const Gs = [], Ms = [], D = {}, lit = {};
    for (const w of L.words) {
      const v = this.wval(w);
      if (!Number.isFinite(v)) { this.warn('Не удалось вычислить ' + w.c + w.raw, L.i); continue; }
      if (w.c === 'G') Gs.push(v);
      else if (w.c === 'M') Ms.push(v);
      else if (!(w.c in D)) { D[w.c] = v; lit[w.c] = w; }
    }
    // длины с учётом единиц и «точки»
    const A = {};
    for (const l of LEN_LETTERS) {
      if (!(l in D)) continue;
      let v = D[l];
      const w = lit[l];
      if (this.isLit(w) && !w.raw.includes('.') && v !== 0 && !this.cyIgnoreDot) {
        if (!this.o.calc && 'XYZUWVIJK'.includes(l)) {
          v *= (this.us === 25.4 ? 0.0001 : 0.001);
          this.noDotCount++;
          if (!this.dpWarned) { this.dpWarned = true; this.warn(l + w.raw + ' без десятичной точки читается как ' + f3(v * this.us) + ' мм (стандарт Fanuc)', L.i); }
        } else if (!this.o.calc && (l === 'R' || l === 'Q')) {
          v *= (this.us === 25.4 ? 0.0001 : 0.001);
        }
      }
      A[l] = v * this.us;
    }
    for (const l of (lathe ? 'ABCH' : 'ABC')) {
      if (!(l in D)) continue;
      let v = D[l]; const w = lit[l];
      if (this.isLit(w) && !w.raw.includes('.') && v !== 0 && !this.o.calc && !(l === 'C' && lathe && this.polar)) {
        v *= 0.001;
        if (!this.angWarned) { this.angWarned = true; this.warn(l + w.raw + ' без десятичной точки читается как ' + f3(v) + '° (стандарт Fanuc)', L.i); }
      }
      if (l === 'C' && lathe && this.polar) v = D[l] * (this.isLit(w) && !w.raw.includes('.') && !this.o.calc ? 0.001 : 1);
      A[l] = v;
    }
    if (D.F !== undefined) this.f = D.F * this.us;
    if (D.T !== undefined && !opt.noTool) this.setTool(D.T);
    if (D.S !== undefined && !(lathe && Gs.includes(50))) this.s = D.S;
    if (lathe && Gs.includes(50) && D.S !== undefined) this.ssLimit = D.S;

    let homeCmd = false, dwellCmd = false, coordSet = false, mach = false, call = null, cycCall = false, cancelComp = false, twpCmd = false, liveCall = 0;
    for (const g of Gs) {
      switch (g) {
        case 0: case 1: case 2: case 3: this.mot = g; this.lcyc = 0; this.cyc = 0; this.llc = 0; break;
        case 4: dwellCmd = true; break;
        case 17: case 18: case 19: this.plane = g; break;
        case 20: this.us = 25.4; break;
        case 21: this.us = 1; break;
        case 28: homeCmd = true; break;
        case 32: if (lathe) { this.mot = 32; this.lcyc = 0; } else this.warn('G32 не используется на фрезерной стойке', L.i, 'g32'); break;
        case 40: if (this.comp !== 40) cancelComp = true; this.comp = 40; break;
        case 41: case 42:
          if (lathe) this.info('G' + g + ': коррекция на радиус вершины. Показывается путь вершины по контуру детали, смещение центра пластины не рассчитывается', L.i, 'comp');
          else {
            if (this.comp !== 40 && this.comp !== g) this.compFlush(null);
            this.comp = g;
            if (this.plane !== 17) this.warn('Коррекция G' + g + ' рассчитывается только в плоскости G17', L.i, 'compp');
            else if (this.o.compWear) this.info('G' + g + ': по настройке «Станок → Коррекция G41/G42» программа считается траекторией центра фрезы (Fusion «Износ»): смещение на радиус не выполняется', L.i, 'compinfo');
            else this.info('G' + g + ': в программе контур детали, траектория центра фрезы смещена на радиус Ø/2 из таблицы инструмента (как при D = радиус фрезы). Оранжевый пунктир — контур из программы. Если в Fusion коррекция «Износ», переключите на вкладке «Станок»', L.i, 'compinfo');
          }
          break;
        case 43.4: case 43.5: if (lathe) this.warn('G43.4 на токарной стойке не используется', L.i, 'g434'); else { this.tcp = true; this.lenc = true; } break;
        case 68.2: if (!lathe) { twpCmd = true; } break;
        case 69: this.twp = null; break;
        case 53.1: break;
        case 12.1: case 112: if (lathe) this.polarOn(); else this.warn('G12.1/G112 только на токарной стойке', L.i, 'g121'); break;
        case 13.1: case 113: if (lathe) this.polarOff(); break;
        case 43: case 44: this.lenc = true; if (!('H' in D) && !lathe) this.warn('G' + g + ' без H', L.i); break;
        case 49: this.lenc = false; this.tcp = false; break;
        case 53: mach = true; break;
        case 54: case 55: case 56: case 57: case 58: case 59: this.wcs = g; break;
        case 61: case 62: case 63: case 64: case 15: case 16: break;
        case 65: case 66: case 67: this.warn('G' + g + ' (макровызов) не поддерживается симулятором', L.i, 'g65'); break;
        case 50: if (lathe) { if (A.X !== undefined || A.Z !== undefined) coordSet = true; } else this.warn('G50 не поддерживается', L.i, 'g50'); break;
        case 90: if (lathe) this.lcyc = 90; else this.inc = false; break;
        case 91: if (lathe) this.warn('G91 в системе G-кодов A не используется (применяйте U/W)', L.i, 'g91l'); else this.inc = true; break;
        case 92: if (lathe) this.lcyc = 92; else coordSet = true; break;
        case 94: if (lathe) this.lcyc = 94; else this.perRev = false; break;
        case 95: if (!lathe) this.perRev = true; break;
        case 96: this.css = true; break;
        case 97: this.css = false; break;
        case 98: if (lathe) this.perRev = false; else this.retr = 98; break;
        case 99: if (lathe) this.perRev = true; else this.retr = 99; break;
        case 70: case 71: case 72: case 73: case 74: case 75: case 76:
          if (lathe) call = g;
          else if (g === 73 || g === 74 || g === 76) { this.cyc = g; cycCall = true; }
          else this.warn('G' + g + ' не поддерживается на фрезерной стойке', L.i, 'gx' + g);
          break;
        case 80: this.cyc = 0; this.cyInit = null; this.llc = 0; break;
        case 81: case 82: case 83: case 84: case 85: case 86: case 87: case 88: case 89:
          if (lathe && (g === 83 || g === 87)) { liveCall = g; this.llc = g; }
          else if (lathe) this.warn('G' + g + ' на токарной стойке не симулируется', L.i, 'gl' + g);
          else { this.cyc = g; cycCall = true; this.lcyc = 0; }
          break;
        default: this.warn('G' + g + ' не поддерживается симулятором и пропущен', L.i, 'g' + g);
      }
    }
    // M-коды
    let sig = null;
    for (const m of Ms) {
      switch (m) {
        case 0: case 1: break;
        case 2: case 30: case 99:
          if (m === 99) sig = { ret: true }; else sig = { end: true };
          break;
        case 3: this.spin = 3; break;
        case 4: this.spin = 4; break;
        case 5: this.spin = 0; break;
        case 6: if (!lathe) this.changeTool(); break;
        case 7: case 8: case 9: case 19: case 29: case 51: case 52: case 53: case 10: case 11: case 12: case 13: case 14: case 15: case 24: case 25: case 34: case 35: case 44: case 45: case 46: case 48: case 49: case 89: case 90: break;
        case 98: {
          let p = D.P, cnt = D.L !== undefined ? D.L : 1;
          if (p === undefined) { this.err('M98 без P', L.i); break; }
          p = Math.round(p);
          if (p > 9999 && D.L === undefined) { cnt = Math.floor(p / 10000); p = p % 10000; }
          sig = { call: p, count: Math.max(1, Math.round(cnt)) };
          break;
        }
        default: this.info('M' + m + ' игнорируется', L.i, 'm' + m);
      }
    }
    if (opt.noMotion) return sig;

    const axes = lathe ? ['X', 'Z', 'U', 'W', 'C', 'H'] : ['X', 'Y', 'Z', 'B', 'C'];
    const hasAxis = axes.some(a => a in A);
    if (!lathe && 'A' in A) this.warn('Ось A не поддерживается (на KVL 1000 поворотный стол по B и C)', L.i, 'axA');
    if (lathe && ('Y' in A || 'B' in A)) this.warn('На Puma 3050 LM есть только оси X, Z, C: слово ' + ('Y' in A ? 'Y' : 'B') + ' пропущено', L.i, 'axYB');

    // цель в программных координатах
    const tgt = { x: this.pos.x, y: this.pos.y, z: this.pos.z };
    if (lathe) {
      if ('X' in A) tgt.x = A.X; else if ('U' in A) tgt.x = this.pos.x + A.U;
      if ('Z' in A) tgt.z = A.Z; else if ('W' in A) tgt.z = this.pos.z + A.W;
      if ('C' in A) tgt.c = A.C; else if ('H' in A) tgt.c = this.ac + A.H;
    } else {
      for (const k of ['X', 'Y', 'Z']) {
        const key = k.toLowerCase();
        if (k in A) tgt[key] = (this.inc && !mach) ? this.pos[key] + A[k] : A[k];
      }
      if ('B' in A) tgt.b = this.inc ? this.ab + A.B : A.B;
      if ('C' in A) tgt.c = this.inc ? this.ac + A.C : A.C;
    }
    if (mach) { const o = this.offv(); tgt.x -= (('X' in A) ? o.x : 0); tgt.y -= (('Y' in A) ? o.y : 0); tgt.z -= (('Z' in A) ? o.z : 0); }

    if (twpCmd) { this.setTwp(D, A); return sig; }
    if (lathe && this.polar && ('X' in A || 'C' in A || 'U' in A || 'Z' in A || 'W' in A) && !homeCmd) { this.polarMove(A, tgt); return sig; }
    if (lathe && this.llc && (liveCall || 'C' in A || 'X' in A || 'Z' in A) && !homeCmd && !dwellCmd && !call) { this.liveCycle(this.llc, A, D, tgt); return sig; }
    if (coordSet) {
      const nw = { x: this.pos.x, y: this.pos.y, z: this.pos.z };
      for (const k of ['X', 'Y', 'Z']) if (k in A) nw[k.toLowerCase()] = A[k];
      this.shift = { x: this.shift.x + this.pos.x - nw.x, y: this.shift.y + this.pos.y - nw.y, z: this.shift.z + this.pos.z - nw.z };
      this.pos = nw;
      return sig;
    }
    if (homeCmd) { this.goHome(A, tgt, hasAxis); return sig; }
    if (dwellCmd) {
      let sec = 0;
      if (D.P !== undefined) sec = D.P / 1000;
      else if (D.X !== undefined) sec = D.X;
      else if (D.U !== undefined) sec = D.U;
      this.dwell(sec, 'G04');
      return sig;
    }
    if (lathe) {
      if (call) { this.latheCall(call, L, A, D, lit, tgt); return sig; }
      if (this.lcyc && hasAxis) {
        const lm = this.lm || (this.lm = {});
        if ('X' in A) lm.x = A.X; else if ('U' in A) lm.x = this.pos.x + A.U;
        if ('Z' in A) lm.z = A.Z; else if ('W' in A) lm.z = this.pos.z + A.W;
        if ('R' in A) lm.r = A.R; else if (call === null && !('R' in A) && lm.rKeep !== true) lm.r = lm.r || 0;
        this.latheSimple(this.lcyc, { R: lm.r || 0 }, { x: lm.x === undefined ? this.pos.x : lm.x, y: 0, z: lm.z === undefined ? this.pos.z : lm.z });
        return sig;
      }
    } else if (this.cyc) {
      if (cycCall || 'X' in A || 'Y' in A) this.millCycle(A, D, tgt, cycCall);
      return sig;
    }
    if (cancelComp) {
      this.compFlush(hasAxis ? tgt : null, this.mot === 0 ? 'R' : 'F');
      if (hasAxis) { this.pos = { x: tgt.x, y: tgt.y, z: tgt.z }; return sig; }
    }
    if (hasAxis) {
      const m = this.mot;
      if (m === 0) this.lineTo('R', tgt);
      else if (m === 1) this.lineTo('F', tgt);
      else if (m === 32) this.lineTo('T', tgt, 'G32');
      else if (m === 2 || m === 3) this.arcMove(tgt, m === 2, A);
    }
    return sig;
  }

  /* ---------- инструмент ---------- */
  setTool(T) {
    if (this.lathe) {
      const t = T >= 100 ? Math.floor(T / 100) : T;
      this.tool = t; this.toolOff = T % 100;
      this.toolsUsed.add(t);
    } else {
      this.nextTool = T;
      this.toolsUsed.add(T);
    }
  }
  changeTool() {
    this.compFlush(null);
    if (this.ops && this.ops[this.op] && this.ops[this.op].n > 0) { this.ops.push({ name: '', line: this.curLine, n: 0 }); this.op = this.ops.length - 1; }
    if (this.nextTool === null && this.tool === null) { this.warn('M6 без T', this.curLine, 'm6t'); return; }
    if (this.nextTool !== null) this.tool = this.nextTool;
    this.toolsUsed.add(this.tool);
    if (!this.capture) {
      const p = this.toM(this.pos);
      this.moves.push({ k: 'C', pts: [p, p.slice()], line: this.curLine, n: this.L ? this.L.n : null, t: this.tool, f: this.f, rpm: this.s, spin: this.spin, len: 0, time: this.o.toolChange, wo: this.offv(), cl: null, tc: true });
    }
  }

  goHome(A, tgt, hasAxis) {
    this.compFlush(null);
    const h = this.o.home, lathe = this.lathe;
    if (!hasAxis) { this.warn('G28 без осей: перемещение не выполнено', this.curLine, 'g28'); return; }
    // промежуточная точка
    if (tgt.x !== this.pos.x || tgt.y !== this.pos.y || tgt.z !== this.pos.z) this.lineTo('R', tgt);
    const t = { x: this.pos.x, y: this.pos.y, z: this.pos.z };
    if (lathe && ('H' in A || 'C' in A)) t.c = 0;
    if (lathe) { if ('X' in A || 'U' in A) t.x = h.x; if ('Z' in A || 'W' in A) t.z = h.z; }
    else { if ('X' in A) t.x = h.x; if ('Y' in A) t.y = h.y; if ('Z' in A) t.z = h.z; }
    this.lineTo('R', t, 'G28');
  }

  /* ================= ФРЕЗЕРНЫЕ ЦИКЛЫ ================= */
  millCycle(A, D, tgt, call) {
    this.compFlush(null);
    this.inCycle = true;
    try { this.millCycle2(A, D, tgt, call); } finally { this.inCycle = false; }
  }
  millCycle2(A, D, tgt, call) {
    const cy = this.cy, cyc = this.cyc;
    if (call) { this.cyInit = this.pos.z; cy.z = undefined; cy.r = undefined; cy.q = undefined; cy.p = undefined; }
    if (this.cyInit === null) this.cyInit = this.pos.z;
    if ('Z' in A) cy.z = A.Z;
    if ('R' in A) cy.r = A.R;
    if ('Q' in A) cy.q = A.Q;
    if (D.P !== undefined) cy.p = D.P;
    if (cy.z === undefined || cy.r === undefined) { this.err('Цикл G' + cyc + ': не заданы Z или R', this.curLine); return; }
    if (this.plane !== 17) { this.warn('Циклы поддерживаются только в плоскости G17', this.curLine, 'cplane'); return; }
    const init = this.cyInit, inc = this.inc;
    const rp = inc ? init + cy.r : cy.r;
    const zb = inc ? rp + cy.z : cy.z;
    const reps = Math.max(1, Math.round(D.K !== undefined ? D.K : (D.L !== undefined ? D.L : 1)));
    const tag = 'G' + cyc;
    const dx = inc ? (A.X || 0) : 0, dy = inc ? (A.Y || 0) : 0;
    const clr = 1.0;     // зазор при быстром подводе в G83 / отвод в G73
    const p0 = { x: this.pos.x, y: this.pos.y };
    if (zb >= rp) this.warn('Цикл G' + cyc + ': дно (Z' + f3(zb) + ') не ниже плоскости R (' + f3(rp) + ')', this.curLine);
    for (let k = 1; k <= reps; k++) {
      const hx = inc ? p0.x + dx * k : tgt.x, hy = inc ? p0.y + dy * k : tgt.y;
      if (hx !== this.pos.x || hy !== this.pos.y) this.lineTo('R', { x: hx, y: hy, z: this.pos.z }, tag);
      if (Math.abs(this.pos.z - rp) > 1e-9) this.rapid(undefined, undefined, rp, tag);
      const home = this.retr === 98 ? Math.max(init, rp) : rp;
      const q = cy.q;
      switch (cyc) {
        case 81: case 82: case 85: case 86: case 89: case 84: case 87: case 88: {
          if (cyc > 86 && cyc !== 89 && cyc !== 84) this.warn('G' + cyc + ' выполняется как G81', this.curLine, 'cx' + cyc);
          this.feed(undefined, undefined, zb, tag);
          const dw = (cyc === 82 || cyc === 89) ? (cy.p || 0) / 1000 : 0;
          if (dw) this.dwell(dw, tag);
          if (cyc === 84) { const sp = this.spin; this.feed(undefined, undefined, rp, tag); this.spin = sp; }
          else if (cyc === 85 || cyc === 89) this.feed(undefined, undefined, rp, tag);
          else this.rapid(undefined, undefined, rp, tag);
          break;
        }
        case 83: case 73: {
          if (!(q > 0)) { this.err('Цикл G' + cyc + ' требует Q > 0', this.curLine); this.feed(undefined, undefined, zb, tag); this.rapid(undefined, undefined, rp, tag); break; }
          let cur = rp;
          while (cur > zb + 1e-9) {
            const nxt = Math.max(cur - q, zb);
            this.feed(undefined, undefined, nxt, tag);
            if (nxt > zb + 1e-9) {
              if (cyc === 83) { this.rapid(undefined, undefined, rp, tag); this.rapid(undefined, undefined, Math.min(nxt + clr, rp), tag); }
              else this.rapid(undefined, undefined, Math.min(nxt + clr, rp), tag);
            }
            cur = nxt;
          }
          this.rapid(undefined, undefined, rp, tag);
          break;
        }
        default:
          this.warn('G' + cyc + ' не поддерживается, выполнен как G81', this.curLine, 'cx' + cyc);
          this.feed(undefined, undefined, zb, tag); this.rapid(undefined, undefined, rp, tag);
      }
      if (this.retr === 98 && init > this.pos.z) this.rapid(undefined, undefined, init, tag);
    }
  }

  /* ================= ТОКАРНЫЕ ЦИКЛЫ ================= */
  latheSimple(g, A, tgt) {
    const p = { x: this.pos.x, z: this.pos.z };
    const R = A.R || 0;
    if (g === 90) {
      const xb = tgt.x + 2 * R;
      this.rapid(xb, undefined, undefined, 'G90');
      this.feed(tgt.x, undefined, tgt.z, 'G90');
      this.feed(p.x, undefined, tgt.z, 'G90');
      this.rapid(p.x, undefined, p.z, 'G90');
    } else if (g === 94) {
      const zb = tgt.z + R;
      this.rapid(undefined, undefined, zb, 'G94');
      this.feed(tgt.x, undefined, tgt.z, 'G94');
      this.feed(tgt.x, undefined, p.z, 'G94');
      this.rapid(p.x, undefined, p.z, 'G94');
    } else if (g === 92) {
      const xb = tgt.x + 2 * R;
      this.rapid(xb, undefined, undefined, 'G92');
      this.feed(tgt.x, undefined, tgt.z, 'G92', 'T');
      this.rapid(p.x, undefined, undefined, 'G92');
      this.rapid(undefined, undefined, p.z, 'G92');
    }
  }

  captureContour(prog, ns, nf) {
    const i0 = this.findN(prog, ns);
    let i1 = -1;
    for (let i = Math.max(i0, 0); i < prog.lines.length; i++) if (prog.lines[i].n === nf) { i1 = i; break; }
    if (i0 < 0 || i1 < 0) { this.err('Не найдены кадры контура N' + ns + '–N' + nf, this.curLine); return null; }
    const sv = { pos: { ...this.pos }, mot: this.mot, f: this.f, plane: this.plane, shift: { ...this.shift }, wcs: this.wcs, curLine: this.curLine, L: this.L, lcyc: this.lcyc, us: this.us };
    this.capture = [this.toM(this.pos)];
    this.mot = 0;
    for (let i = i0; i <= i1; i++) {
      const L = prog.lines[i];
      if (L.kind === 'words') this.execBlock(L, { noMotion: false, noTool: true, capture: true });
    }
    const pts = this.capture;
    this.capture = null;
    const wo = this.offv();
    Object.assign(this, { pos: sv.pos, mot: sv.mot, f: sv.f, plane: sv.plane, shift: sv.shift, wcs: sv.wcs, curLine: sv.curLine, L: sv.L, lcyc: sv.lcyc, us: sv.us });
    return { pts: pts.map(q => ({ x: q[0] - wo.x, z: q[2] - wo.z })), i0, i1 };
  }

  latheCall(g, L, A, D, lit, tgt) {
    const pe = this.pend;
    const prog = this.curProg;
    const raw = c => (lit[c] ? lit[c].raw : '');
    const um = v => v === undefined ? undefined : v * 0.001 * this.us;
    switch (g) {
      case 71: case 72: case 73: {
        const isFin = D.P !== undefined && D.Q !== undefined;
        if (!isFin) {
          pe[g] = { U: A.U, W: A.W, R: A.R, D: D.R };
          if (g === 73 && D.R !== undefined) pe[g].n = Math.max(1, Math.round(D.R));
          return;
        }
        const pr = pe[g];
        if (!pr) { this.err('G' + g + ': не задан первый кадр (G' + g + ' U.. R..)', L.i); return; }
        const fin = { U: A.U || 0, W: A.W || 0 };
        const cap = this.captureContour(prog, Math.round(D.P), Math.round(D.Q));
        if (!cap) return;
        this.jump = cap.i1 + 1;
        if (g === 73) this.latheRepeat(pr, fin, cap); else this.latheRough(g, pr, fin, cap);
        return;
      }
      case 70: {
        const ns = Math.round(D.P), nf = Math.round(D.Q);
        const i0 = this.findN(prog, ns);
        let i1 = -1;
        for (let i = Math.max(i0, 0); i < prog.lines.length; i++) if (prog.lines[i].n === nf) { i1 = i; break; }
        if (i0 < 0 || i1 < 0) { this.err('G70: не найдены кадры N' + ns + '–N' + nf, L.i); return; }
        const A0 = { x: this.pos.x, z: this.pos.z };
        const sv = this.mot;
        this.mot = 0;
        for (let i = i0; i <= i1; i++) { const BL = prog.lines[i]; if (BL.kind === 'words') this.execBlock(BL, { noTool: true }); }
        this.curLine = L.i; this.L = L;
        this.rapid(A0.x, undefined, undefined, 'G70');
        this.rapid(undefined, undefined, A0.z, 'G70');
        this.mot = 0; this.lcyc = 0;
        return;
      }
      case 74: case 75: {
        const hasXZ = ('X' in A) || ('Z' in A) || ('U' in A) || ('W' in A);
        if (!hasXZ) { pe[g] = { e: A.R }; return; }
        this.latheGroove(g, A, D, tgt, pe[g] || {});
        return;
      }
      case 76: {
        const hasXZ = ('X' in A) || ('Z' in A) || ('U' in A) || ('W' in A);
        if (!hasXZ) {
          const ps = raw('P').replace(/^[+-]/, '').padStart(6, '0');
          pe[76] = { m: +ps.slice(0, 2) || 1, Dmin: um(D.Q) || 0, fin: um(D.R) || 0 };
          return;
        }
        this.latheThread(A, D, tgt, pe[76] || { m: 1, Dmin: 0, fin: 0 }, um);
        return;
      }
    }
  }

  /* G71 (продольное) / G72 (торцевое) черновое точение, тип I */
  latheRough(g, pr, fin, cap) {
    const A0 = { x: this.pos.x, z: this.pos.z };
    const G71 = g === 71;
    const dd = G71 ? Math.abs(pr.U || 0) : Math.abs(pr.W || 0);
    const e = Math.abs(pr.R || 0);
    if (!(dd > 0)) { this.err('G' + g + ': глубина резания за проход равна 0', this.curLine); return; }
    // координаты (c — вдоль резания, d — глубина)
    const toCD = p => G71 ? [p.z, p.x / 2] : [p.x / 2, p.z];
    const toXZ = (c, d) => G71 ? { x: 2 * d, z: c } : { x: 2 * c, z: d };
    const off = G71 ? [fin.W, fin.U / 2] : [fin.U / 2, fin.W];
    const s = (G71 ? fin.U : fin.W) >= 0 ? 1 : -1;
    const P = cap.pts.map(toCD);       // первая точка — A
    const Q = P.map((q, i) => i === 0 ? q : [q[0] + off[0], q[1] + off[1]]);
    if (Q.length < 2) return;
    const c0 = Q[1][0], c1 = Q[Q.length - 1][0];
    const dirC = Math.abs(c1 - c0) < 1e-6 ? -1 : Math.sign(c1 - c0);
    const Ac = Q[0][0], Ad = Q[0][1];
    const u0 = s * Ad;
    let uMin = Infinity;
    for (let i = 1; i < Q.length; i++) uMin = Math.min(uMin, s * Q[i][1]);
    // проверка монотонности
    let mono = true;
    for (let i = 2; i < Q.length; i++) if ((Q[i][0] - Q[i - 1][0]) * dirC < -1e-6) mono = false;
    if (!mono) this.warn('G' + g + ': контур не монотонен по оси резания (нужен тип II, он не поддерживается): результат приблизителен', this.curLine, 'mono' + g);
    if (!(uMin < u0 - 1e-6)) { this.warn('G' + g + ': заготовка в точке A уже не больше контура, обработки нет', this.curLine); return; }
    const levels = [];
    for (let u = u0 - dd; u > uMin + 1e-6; u -= dd) levels.push(u);
    levels.push(uMin);
    const ZS = (u) => {
      for (let i = 1; i < Q.length - 1 || i === 1; i++) {
        if (i >= Q.length - 1 && Q.length > 2) break;
        const [ca, da] = [Q[i][0], s * Q[i][1]], [cb, db] = Q.length > i + 1 ? [Q[i + 1][0], s * Q[i + 1][1]] : [ca, da];
        if (da > u + 1e-9) return ca;
        if (db > u + 1e-9) { const t = (u - da) / (db - da); return ca + t * (cb - ca); }
      }
      return Q[Q.length - 1][0];
    };
    let guardN = 0;
    for (const u of levels) {
      if (++guardN > 400) break;
      const d = s * u;
      const cs = ZS(u);
      if ((cs - Ac) * dirC <= 1e-6) continue;
      let p = toXZ(Ac, d);
      this.rapid(p.x, undefined, p.z, 'G' + g);
      p = toXZ(cs, d);
      this.feed(p.x, undefined, p.z, 'G' + g);
      const out = s * (u + e);
      p = toXZ(cs - dirC * e, out);
      this.feed(p.x, undefined, p.z, 'G' + g);
      p = toXZ(Ac, out);
      this.rapid(p.x, undefined, p.z, 'G' + g);
    }
    // чистовой проход по контуру с припуском
    let p = toXZ(Ac, Ad);
    this.rapid(p.x, undefined, p.z, 'G' + g);
    for (let i = 1; i < Q.length; i++) {
      p = toXZ(Q[i][0], Q[i][1]);
      if (i === 1) this.rapid(p.x, undefined, p.z, 'G' + g); else this.feed(p.x, undefined, p.z, 'G' + g);
    }
    // возврат в A
    if (G71) { this.rapid(A0.x, undefined, undefined, 'G' + g); this.rapid(undefined, undefined, A0.z, 'G' + g); }
    else { this.rapid(undefined, undefined, A0.z, 'G' + g); this.rapid(A0.x, undefined, undefined, 'G' + g); }
    this.mot = 0;
  }

  /* G73 — цикл повтора по контуру */
  latheRepeat(pr, fin, cap) {
    const A0 = { x: this.pos.x, z: this.pos.z };
    const n = Math.max(1, pr.n || 1);
    const dI = pr.U || 0, dK = pr.W || 0;
    const P = cap.pts;
    if (P.length < 2) return;
    for (let i = 0; i < n; i++) {
      const fr = n === 1 ? 0 : (n - 1 - i) / (n - 1);
      const sh = P.map((q, k) => k === 0 ? q : { x: q.x + 2 * (dI * fr + fin.U / 2), z: q.z + dK * fr + fin.W });
      this.rapid(sh[1].x, undefined, undefined, 'G73');
      this.rapid(undefined, undefined, sh[1].z, 'G73');
      for (let k = 2; k < sh.length; k++) this.feed(sh[k].x, undefined, sh[k].z, 'G73');
      this.rapid(A0.x, undefined, undefined, 'G73');
      this.rapid(undefined, undefined, A0.z, 'G73');
    }
    this.mot = 0;
  }

  /* G74 (по Z) / G75 (по X) */
  latheGroove(g, A, D, tgt, pe) {
    const A0 = { x: this.pos.x, z: this.pos.z };
    const e = pe.e !== undefined ? Math.abs(pe.e) : 0.5;
    const tag = 'G' + g;
    const um = v => v === undefined ? undefined : v * 0.001 * this.us;
    const xT = ('X' in A || 'U' in A) ? tgt.x : A0.x, zT = ('Z' in A || 'W' in A) ? tgt.z : A0.z;
    let dI = um(D.P), dK = um(D.Q);
    if (g === 75) {
      // врезание по X шагами dI, сдвиг по Z шагом dK
      const sgnX = Math.sign(xT - A0.x) || -1, sgnZ = Math.sign(zT - A0.z) || -1;
      const stepZ = dK > 0 ? dK : Math.abs(zT - A0.z) || 1e9;
      let z = A0.z, guard = 0;
      for (;;) {
        if (++guard > 200) break;
        this.rapid(undefined, undefined, z, tag);
        if (dI > 0) {
          let x = A0.x;
          while ((xT - x) * sgnX > 1e-9) {
            const nx = (xT - x) * sgnX > dI ? x + sgnX * dI : xT;
            this.feed(nx, undefined, undefined, tag);
            if ((xT - nx) * sgnX > 1e-9) this.rapid(nx - sgnX * e, undefined, undefined, tag);
            x = nx;
          }
        } else this.feed(xT, undefined, undefined, tag);
        this.rapid(A0.x, undefined, undefined, tag);
        if ((zT - z) * sgnZ < 1e-9) break;
        z = (zT - z) * sgnZ > stepZ ? z + sgnZ * stepZ : zT;
      }
      this.rapid(undefined, undefined, A0.z, tag);
    } else {
      // сверление/прорезка по Z шагами dK, сдвиг по X шагом dI
      const sgnX = Math.sign(xT - A0.x) || 1, sgnZ = Math.sign(zT - A0.z) || -1;
      const stepX = dI > 0 ? dI : Math.abs(xT - A0.x) || 1e9;
      let x = A0.x, guard = 0;
      for (;;) {
        if (++guard > 200) break;
        this.rapid(x, undefined, undefined, tag);
        if (dK > 0) {
          let z = A0.z;
          while ((zT - z) * sgnZ > 1e-9) {
            const nz = (zT - z) * sgnZ > dK ? z + sgnZ * dK : zT;
            this.feed(undefined, undefined, nz, tag);
            if ((zT - nz) * sgnZ > 1e-9) this.rapid(undefined, undefined, nz - sgnZ * e, tag);
            z = nz;
          }
        } else this.feed(undefined, undefined, zT, tag);
        this.rapid(undefined, undefined, A0.z, tag);
        if (Math.abs(xT - x) < 1e-9 || (xT - x) * sgnX < 1e-9) break;
        x = (xT - x) * sgnX > stepX ? x + sgnX * stepX : xT;
      }
      this.rapid(A0.x, undefined, undefined, tag);
    }
    this.mot = 0;
  }

  /* G76 — многопроходная резьба */
  latheThread(A, D, tgt, pe, um) {
    const A0 = { x: this.pos.x, z: this.pos.z };
    const k = um(D.P), d1 = um(D.Q);
    const lead = this.f;
    if (!(k > 0) || !(d1 > 0)) { this.err('G76: заданы неверные P (глубина резьбы) / Q (первая глубина)', this.curLine); return; }
    if (!(lead > 0)) { this.warn('G76: не задан шаг F', this.curLine); }
    const xT = tgt.x, zT = tgt.z, taper = (A.R || 0) * 2;
    const ext = A0.x > xT;
    const sgn = ext ? 1 : -1;
    const passes = [];
    let n = 1;
    for (;;) {
      let d = Math.max(d1 * Math.sqrt(n), pe.Dmin || 0);
      if (d >= k - 1e-9) { passes.push(k); break; }
      passes.push(d);
      if (++n > 80) { passes.push(k); break; }
    }
    for (let i = 0; i < Math.max(1, pe.m) - 1; i++) passes.push(k);
    for (const d of passes) {
      const x = xT + sgn * 2 * (k - d);
      this.rapid(x + (taper ? taper : 0), undefined, undefined, 'G76');
      this.feed(x, undefined, zT, 'G76', 'T');
      this.rapid(A0.x, undefined, undefined, 'G76');
      this.rapid(undefined, undefined, A0.z, 'G76');
    }
    this.mot = 0;
  }
}

/* ================================================================
   ОСИ B/C стола (KVL 1000), ось C и живой инструмент (Puma 3050 LM)
   ================================================================ */
const mulv = (M, v) => [M[0][0] * v[0] + M[0][1] * v[1] + M[0][2] * v[2], M[1][0] * v[0] + M[1][1] * v[1] + M[1][2] * v[2], M[2][0] * v[0] + M[2][1] * v[1] + M[2][2] * v[2]];
const mulm = (A, B) => A.map((r, i) => [0, 1, 2].map(j => r[0] * B[0][j] + r[1] * B[1][j] + r[2] * B[2][j]));
const rotX = a => { const c = Math.cos(a), s = Math.sin(a); return [[1, 0, 0], [0, c, -s], [0, s, c]]; };
const rotY = a => { const c = Math.cos(a), s = Math.sin(a); return [[c, 0, s], [0, 1, 0], [-s, 0, c]]; };
const rotZ = a => { const c = Math.cos(a), s = Math.sin(a); return [[c, -s, 0], [s, c, 0], [0, 0, 1]]; };

Interp.prototype.rotActive = function () { return !this.lathe && !!(this.twp || this.ab || this.ac); };

/* поза инструмента: точка в системе заготовки (в рамке «нуль детали + G54») и ось инструмента */
Interp.prototype.poseOf = function (p) {
  const wo = this.offv();
  if (this.twp) {
    const q = mulv(this.twp.R, [p.x, p.y, p.z]), o = this.twp.o;
    return { pt: [q[0] + o[0] + wo.x, q[1] + o[1] + wo.y, q[2] + o[2] + wo.z], dir: mulv(this.twp.R, [0, 0, 1]) };
  }
  const rot = this.o.rot || { sB: 1, sC: 1, bx: 0, bz: 0 };
  const b = rot.sB * (p.b || 0) * D2R, c = rot.sC * (p.c || 0) * D2R;
  const RbT = rotY(-b), RcT = rotZ(-c);
  const dir = mulv(RcT, mulv(RbT, [0, 0, 1]));
  if (!this.tcp && (p.b || p.c)) this.info('Повороты стола B/C применены к машинным осям. Если направление +B/+C или положение оси B не совпадает со станком, поправьте их на вкладке «Заготовка и нули»', this.curLine, 'rotinfo');
  if (this.tcp) return { pt: [p.x + wo.x, p.y + wo.y, p.z + wo.z], dir };
  const M = [p.x + wo.x, p.y + wo.y, p.z + wo.z], Bp = [wo.x + (rot.bx || 0), wo.y, wo.z + (rot.bz || 0)], T0 = [wo.x, wo.y, wo.z];
  const m2 = mulv(RbT, [M[0] - Bp[0], M[1] - Bp[1], M[2] - Bp[2]]);
  const m3 = [m2[0] - (T0[0] - Bp[0]), m2[1] - (T0[1] - Bp[1]), m2[2] - (T0[2] - Bp[2])];
  const w = mulv(RcT, m3);
  return { pt: [T0[0] + w[0], T0[1] + w[1], T0[2] + w[2]], dir };
};

Interp.prototype.liveDirs = function (cs) {
  const k = this.o.toolKind ? this.o.toolKind(this.tool) : null;
  if (k !== 'live_rad') return null;
  return cs.map(c => { const a = c * D2R; return [Math.cos(a), Math.sin(a), 0]; });
};

/* точки отрезка a→b: для поворотов стола и оси C разбиваем на шаги */
Interp.prototype.seqPts = function (a, b) {
  if (this.lathe) {
    const dC = Math.abs(b.c - a.c);
    const live = this.o.toolKind && /^live/.test(this.o.toolKind(this.tool) || '');
    if (!dC && !a.c && !(live && this.o.toolKind(this.tool) === 'live_rad')) return { pts: [this.toM(a), this.toM(b)], dirs: null };
    const N = clamp(Math.ceil(dC / 4), 1, 360), pts = [], cs = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      pts.push(this.toM({ x: a.x + (b.x - a.x) * t, y: 0, z: a.z + (b.z - a.z) * t }));
      cs.push(a.c + (b.c - a.c) * t);
    }
    const out = { pts, cs: (dC || a.c) ? cs : undefined, dirs: this.liveDirs(cs) };
    return out;
  }
  const rotary = this.twp || a.b || a.c || b.b || b.c;
  if (!rotary) return { pts: [this.toM(a), this.toM(b)], dirs: null };
  const dAng = Math.max(Math.abs(b.b - a.b), Math.abs(b.c - a.c)), len = hyp(b.x - a.x, b.y - a.y, b.z - a.z);
  const N = clamp(Math.max(Math.ceil(dAng / 2), Math.ceil(len / 4)), 1, 500);
  const pts = [], dirs = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const o = this.poseOf({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: a.z + (b.z - a.z) * t, b: a.b + (b.b - a.b) * t, c: a.c + (b.c - a.c) * t });
    pts.push(o.pt); dirs.push(o.dir);
  }
  return { pts, dirs };
};

/* G68.2 X Y Z I J K: наклонная рабочая плоскость (углы Эйлера Z–X'–Z'') */
Interp.prototype.setTwp = function (D, A) {
  const I = (D.I || 0) * D2R, J = (D.J || 0) * D2R, K = (D.K || 0) * D2R;
  const R = mulm(mulm(rotZ(I), rotX(J)), rotZ(K));
  this.twp = { o: [A.X || 0, A.Y || 0, A.Z || 0], R };
  this.info('G68.2: наклонная плоскость, I' + f3(D.I || 0) + ' J' + f3(D.J || 0) + ' K' + f3(D.K || 0) + '. Ось инструмента совмещается с Z плоскости (как после G53.1)', this.curLine, 'g682');
};

/* ---------- токарная: полярная интерполяция G12.1 / G112 ---------- */
Interp.prototype.polarOn = function () {
  const r = Math.abs(this.pos.x) / 2, a = this.ac * D2R;
  this.polar = true;
  this.pp = { px: r * Math.cos(a), py: r * Math.sin(a) };
  this.info('G12.1: полярная интерполяция. X — диаметр, C — линейная ось в мм (координата Y на торце)', this.curLine, 'g121i');
};
Interp.prototype.polarOff = function () { this.polar = false; };
Interp.prototype.polarMove = function (A, tgt) {
  const pp = this.pp, tx = ('X' in A) ? A.X / 2 : ('U' in A ? pp.px + A.U / 2 : pp.px), ty = ('C' in A) ? A.C : pp.py;
  const tz = ('Z' in A) ? A.Z : ('W' in A ? this.pos.z + A.W : this.pos.z);
  const dist = hyp(tx - pp.px, ty - pp.py, tz - this.pos.z), N = clamp(Math.ceil(dist / 0.5), 1, 600);
  const pts = [], cs = [];
  let last = this.ac;
  for (let i = 0; i <= N; i++) {
    const t = i / N, px = pp.px + (tx - pp.px) * t, py = pp.py + (ty - pp.py) * t, z = this.pos.z + (tz - this.pos.z) * t;
    let c = Math.atan2(py, px) / D2R;
    if (hyp(px, py) < 1e-6) c = last;
    while (c - last > 180) c -= 360; while (c - last < -180) c += 360;
    last = c;
    pts.push(this.toM({ x: 2 * hyp(px, py), y: 0, z })); cs.push(c);
  }
  pts[0] = this.toM(this.pos); cs[0] = this.ac;
  this.emit(this.mot === 0 ? 'R' : 'F', pts, 'G12.1', { cs, dirs: this.liveDirs(cs) });
  this.pos = { x: 2 * hyp(tx, ty), y: 0, z: tz }; this.ac = last; this.pp = { px: tx, py: ty };
};

/* ---------- токарная: сверление живым инструментом G83 (торец) / G87 (бок) ---------- */
Interp.prototype.liveCycle = function (g, A, D, tgt) {
  const cy = this.lcy;
  if ('Z' in A) cy.z = A.Z; if ('X' in A) cy.x = A.X; if ('R' in A) cy.r = Math.abs(A.R); if ('Q' in A) cy.q = Math.abs(A.Q);
  const tag = 'G' + g;
  const init = { x: this.pos.x, z: this.pos.z };
  const front = g === 83;
  if (front && cy.z === undefined) { this.err('G83: не задан Z дна отверстия', this.curLine); return; }
  if (!front && cy.x === undefined) { this.err('G87: не задан X дна отверстия', this.curLine); return; }
  // позиционирование по C (и X / Z)
  const c = tgt.c === undefined ? this.ac : tgt.c;
  if (front) this.lineTo('R', { x: ('X' in A) ? A.X : this.pos.x, y: 0, z: this.pos.z, c }, tag);
  else this.lineTo('R', { x: this.pos.x, y: 0, z: ('Z' in A) ? A.Z : this.pos.z, c }, tag);
  const rr = cy.r || 0, q = cy.q || 0;
  if (front) {
    const bottom = cy.z, dir = bottom < init.z ? -1 : 1;
    const rp = rr ? init.z + dir * rr : init.z;
    this.rapid(undefined, undefined, rp, tag);
    let cur = rp, guard = 0;
    while ((bottom - cur) * dir > 1e-9 && guard++ < 500) {
      const nx = q > 0 && Math.abs(bottom - cur) > q ? cur + dir * q : bottom;
      this.feed(undefined, undefined, nx, tag);
      if ((bottom - nx) * dir > 1e-9) { this.rapid(undefined, undefined, rp, tag); this.rapid(undefined, undefined, nx - dir * 1, tag); }
      cur = nx;
    }
    this.rapid(undefined, undefined, init.z, tag);
  } else {
    const bottom = cy.x, dir = bottom < init.x ? -1 : 1;
    const rp = rr ? init.x + dir * 2 * rr : init.x;
    this.rapid(rp, undefined, undefined, tag);
    let cur = rp, guard = 0;
    while ((bottom - cur) * dir > 1e-9 && guard++ < 500) {
      const nx = q > 0 && Math.abs(bottom - cur) > 2 * q ? cur + dir * 2 * q : bottom;
      this.feed(nx, undefined, undefined, tag);
      if ((bottom - nx) * dir > 1e-9) { this.rapid(rp, undefined, undefined, tag); this.rapid(nx - dir * 2, undefined, undefined, tag); }
      cur = nx;
    }
    this.rapid(init.x, undefined, undefined, tag);
  }
};

/* ================================================================
   АВТООПРЕДЕЛЕНИЕ: тип станка по тексту УП и заготовка по программе
   ================================================================ */
function stripCode(src) {
  return src.split(/\r?\n/).map(l => l.replace(/\([^)]*\)/g, ' ').replace(/;.*$/, '').toUpperCase()).join('\n');
}

/* Токарная или фрезерная программа: возвращает 'lathe' | 'mill' | null (если неясно) */
function detectMachine(src) {
  const c = stripCode(src);
  const has = re => re.test(c);
  let lathe = 0, mill = 0;
  if (has(/\bG9[67]\b/)) lathe += 3;
  if (has(/\bG50\b/)) lathe += 2;
  if (has(/\bG7[012]\b/)) lathe += 3;
  if (has(/\bG28\s*U/)) lathe += 3;
  if (has(/(^|[^A-Z])T\d{4}\b/m)) lathe += 3;
  if (has(/\bG18\b/)) lathe += 1;
  if (has(/[\sA-Z0-9.]W-?\d/) && has(/[\sA-Z0-9.]U-?\d/)) lathe += 1;
  if (has(/\bG4[34]\b/)) mill += 3;
  if (has(/\bM0?6\b/)) mill += 3;
  if (has(/\bG8[1-9]\b/) && !has(/\bG9[67]\b/)) mill += 2;
  if (has(/\bY-?\d/)) mill += 2;
  if (has(/\bG17\b/)) mill += 1;
  if (has(/\bG5[4-9]\b/) && has(/\bH\d/)) mill += 1;
  if (lathe >= mill + 2) return 'lathe';
  if (mill >= lathe + 2) return 'mill';
  return null;
}

/* Размеры заготовки из комментариев: (PRUTOK D50 X 70), (ZAGOTOVKA 100X100X20), (STOCK 80x60x15) */
function stockFromComments(src, mode) {
  const re = /\(([^)]*)\)/g;
  let m;
  while ((m = re.exec(src))) {
    const t = m[1].toUpperCase().replace(/,/g, '.');
    if (!/ПРУТОК|PRUTOK|BAR|ZAGOTOVK|ЗАГОТОВК|STOCK|BLANK|BILLET|RAW|ЗАГОТ/.test(t)) continue;
    if (mode === 'lathe') {
      const d = /(?:^|[^A-ZА-Я0-9])(?:D|DIA|Ø|⌀|ДИАМ\w*)\s*=?\s*(\d+(?:\.\d+)?)/.exec(' ' + t);
      if (!d) continue;
      const l = /(?:[XХ*]|L|LEN\w*|ДЛ\w*|LENGTH)\s*=?\s*(\d+(?:\.\d+)?)/.exec(t.slice(t.indexOf(d[0]) + d[0].length));
      return { dia: parseFloat(d[1]), len: l ? parseFloat(l[1]) : null, text: m[1].trim() };
    } else {
      const b = /(\d+(?:\.\d+)?)\s*[XХ*]\s*(\d+(?:\.\d+)?)\s*[XХ*]\s*(\d+(?:\.\d+)?)/.exec(t);
      if (b) return { x: parseFloat(b[1]), y: parseFloat(b[2]), z: parseFloat(b[3]), text: m[1].trim() };
      const d = /(?:^|[^A-ZА-Я])(?:D|DIA|Ø|⌀|KRUG|КРУГ)\s*=?\s*(\d+(?:\.\d+)?)(?:[^0-9]+(\d+(?:\.\d+)?))?/.exec(' ' + t);
      if (d) return { round: parseFloat(d[1]), z: d[2] ? parseFloat(d[2]) : null, text: m[1].trim() };
    }
  }
  return null;
}

/* Заготовка по траектории и комментариям. Координаты — в системе G54 (за вычетом смещения).
   Возвращает { stock, info, source } или null. */
function inferStock(mode, moves, src, toolOf, off) {
  const cm = stockFromComments(src, mode);
  const feed = moves.filter(m => (m.k === 'F' || m.k === 'T') && !m.live);
  if (!feed.length) return null;
  const fmt = v => String(Math.round(v * 10) / 10);
  if (mode === 'lathe') {
    const turning = feed.filter(m => { const t = toolOf(m.t).type; return t !== 'drill'; });
    const pts = [];
    for (const m of turning) for (const p of m.pts) pts.push({ x: Math.abs(p[0] - off.x), z: p[2] - off.z, t: m.t });
    if (!pts.length) return null;
    const t0 = turning[0].t;
    const zFace = Math.max(...pts.filter(p => p.t === t0).map(p => p.z));   // торец: по первому токарному инструменту
    let allZ = Infinity;
    for (const m of feed) for (const p of m.pts) allZ = Math.min(allZ, p[2] - off.z);
    // диаметр: X первой точки первого токарного инструмента, лежащей уже ниже торца (вход в металл)
    let dia = null;
    outer: for (const m of turning) {
      if (m.t !== t0) break;
      for (const p of m.pts) if (p[2] - off.z < zFace - 0.05 && Math.abs(p[0] - off.x) > 1) { dia = Math.abs(p[0] - off.x); break outer; }
    }
    if (dia === null) dia = Math.max(...pts.map(p => p.x));
    let len = (zFace - allZ) + 10, src2 = 'по траектории';
    if (cm && cm.dia) { dia = cm.dia; if (cm.len) len = cm.len; src2 = 'из комментария «' + cm.text + '»'; }
    dia = Math.ceil(dia * 2) / 2;
    return { stock: { dia, len: Math.ceil(len), zFace: Math.round(zFace * 1000) / 1000, bore: 0 }, source: src2, info: 'Заготовка определена автоматически (' + src2 + '): Ø' + fmt(dia) + ' × ' + Math.ceil(len) + ', торец Z' + fmt(zFace) + '. Это оценка: проверьте на вкладке «Заготовка и нули»' };
  }
  // фрезерная
  const vert = feed.filter(m => !m.dirs);
  const use = vert.length ? vert : feed;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, zmin = Infinity, zmax = -Infinity;
  for (const m of use) {
    const r = toolOf(m.t).d / 2;
    for (const p of m.pts) {
      const x = p[0] - off.x, y = p[1] - off.y, z = p[2] - off.z;
      x0 = Math.min(x0, x - r); x1 = Math.max(x1, x + r); y0 = Math.min(y0, y - r); y1 = Math.max(y1, y + r);
      zmin = Math.min(zmin, z); zmax = Math.max(zmax, z);
    }
  }
  const z1 = zmin < -0.1 ? 0 : zmax;
  const margin = 3;
  let st, src2 = 'по траектории';
  if (cm && cm.round) {
    // круглая заготовка из комментария, например (ZAGOTOVKA D120 H30): центр — в нуле или по центру траектории
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, near = Math.abs(cx) < cm.round * 0.1 && Math.abs(cy) < cm.round * 0.1;
    const ccx = near ? 0 : Math.round(cx * 10) / 10, ccy = near ? 0 : Math.round(cy * 10) / 10, r = cm.round / 2;
    const zz = cm.z || Math.ceil(z1 - zmin + 3);
    const st2 = { shape: 'round', dia: cm.round, cx: ccx, cy: ccy, x0: ccx - r, x1: ccx + r, y0: ccy - r, y1: ccy + r, z0: z1 - zz, z1 };
    const src3 = 'из комментария «' + cm.text + '»';
    return { stock: st2, source: src3, info: 'Заготовка определена автоматически (' + src3 + '): круг Ø' + fmt(cm.round) + ', центр X' + fmt(ccx) + ' Y' + fmt(ccy) + ', Z ' + fmt(st2.z0) + '…' + fmt(z1) + '. Проверьте на вкладке «Заготовка и нули»' };
  }
  if (cm && cm.x) {
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const inCorner = x0 >= -cm.x * 0.1 && x1 <= cm.x * 1.1 && y0 >= -cm.y * 0.1 && y1 <= cm.y * 1.1 && x0 > -1;
    const bx0 = inCorner ? 0 : cx - cm.x / 2, by0 = inCorner ? 0 : cy - cm.y / 2;
    const inCenter = !inCorner && Math.abs(cx) < cm.x * 0.2 && Math.abs(cy) < cm.y * 0.2;
    const ox = inCorner ? 0 : inCenter ? -cm.x / 2 : bx0, oy = inCorner ? 0 : inCenter ? -cm.y / 2 : by0;
    st = { x0: ox, x1: ox + cm.x, y0: oy, y1: oy + cm.y, z0: z1 - cm.z, z1 };
    src2 = 'из комментария «' + cm.text + '», положение — ' + (inCorner ? 'угол в нуле' : inCenter ? 'центр в нуле' : 'по траектории');
  } else {
    st = { x0: Math.floor(x0 - margin), x1: Math.ceil(x1 + margin), y0: Math.floor(y0 - margin), y1: Math.ceil(y1 + margin), z0: Math.floor(zmin - 3), z1 };
  }
  st.shape = 'rect';
  return { stock: st, source: src2, info: 'Заготовка определена автоматически (' + src2 + '): X ' + fmt(st.x0) + '…' + fmt(st.x1) + ', Y ' + fmt(st.y0) + '…' + fmt(st.y1) + ', Z ' + fmt(st.z0) + '…' + fmt(st.z1) + '. Это оценка: проверьте на вкладке «Заготовка и нули»' };
}

/* ================================================================
   МОДЕЛИРОВАНИЕ СНЯТИЯ МАТЕРИАЛА И ПРОВЕРКА СТОЛКНОВЕНИЙ
   ================================================================ */
const RAPID_VIS = 10;        // быстрый ход показывается в 10 раз быстрее рабочего

function walkMove(mv, l0, l1, step, cb) {
  const cl = mv.cl, pts = mv.pts, total = cl[cl.length - 1];
  if (!(total > 0)) { cb(pts[0][0], pts[0][1], pts[0][2]); return; }
  l0 = Math.max(0, l0); l1 = Math.min(total, l1);
  if (l1 < l0) return;
  const n = Math.max(1, Math.min(4000, Math.ceil((l1 - l0) / step)));
  let seg = 1;
  for (let i = 0; i <= n; i++) {
    const l = l0 + (l1 - l0) * i / n;
    while (seg < cl.length - 1 && cl[seg] < l) seg++;
    const a = pts[seg - 1], b = pts[seg], sl = cl[seg] - cl[seg - 1];
    const t = sl > 0 ? (l - cl[seg - 1]) / sl : 0;
    cb(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t);
  }
}

function buildTimeline(moves) {
  let w = 0, t = 0, len = { R: 0, F: 0 };
  for (const m of moves) {
    m.w0 = w; m.t0 = t;
    m.w = m.k === 'R' ? Math.max(m.len / RAPID_VIS, 0.02) : (m.k === 'D' || m.k === 'C') ? 4 : Math.max(m.len, 0.02);
    w += m.w; t += m.time || 0;
    if (m.k === 'R') len.R += m.len; else if (m.k === 'F' || m.k === 'T') len.F += m.len;
  }
  return { W: w, T: t, lenR: len.R, lenF: len.F };
}

function moveIndexAt(moves, w) {
  let lo = 0, hi = moves.length - 1;
  if (hi < 0) return -1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (moves[mid].w0 <= w) lo = mid; else hi = mid - 1;
  }
  return lo;
}

function pointOnMove(mv, frac, useQ) {
  const total = mv.cl[mv.cl.length - 1];
  const l = total * frac;
  const cl = mv.cl, pts = (useQ && mv.q) ? mv.q : mv.pts;
  let seg = 1;
  while (seg < cl.length - 1 && cl[seg] < l) seg++;
  const a = pts[seg - 1], b = pts[seg], sl = cl[seg] - cl[seg - 1];
  const t = sl > 0 ? (l - cl[seg - 1]) / sl : 0;
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}

/* половина угла при вершине (сверло 118°, центровка/фаска 90°) */
function coneHalf(tool) {
  const tip = tool.tip || ((tool.type === 'spot' || tool.type === 'chamfer') ? 90 : 118);
  return clamp(tip, 20, 175) / 2 * D2R;
}
const isCone = tool => tool.type === 'drill' || tool.type === 'spot' || tool.type === 'chamfer' || tool.type === 'live_drill';

/* высота профиля фрезы над вершиной на расстоянии d от оси */
function millProf(tool, d) {
  const rt = tool.d / 2;
  switch (tool.type) {
    case 'ball': return rt - Math.sqrt(Math.max(rt * rt - d * d, 0));
    case 'bull': { const cr = Math.min(tool.cr || 0, rt); if (cr > 0 && d > rt - cr) { const q = d - (rt - cr); return cr - Math.sqrt(Math.max(cr * cr - q * q, 0)); } return 0; }
    case 'drill': case 'spot': case 'chamfer': case 'live_drill': return d / Math.tan(coneHalf(tool));
    default: return 0;
  }
}

/* наклон профиля фрезы (для допуска на дискретизацию сетки) */
function millSlope(tool, d) {
  const rt = tool.d / 2;
  switch (tool.type) {
    case 'ball': return Math.min(3, d / Math.sqrt(Math.max(rt * rt - d * d, 1e-3)));
    case 'bull': { const cr = Math.min(tool.cr || 0, rt); if (cr > 0 && d > rt - cr) { const q = d - (rt - cr); return Math.min(3, q / Math.sqrt(Math.max(cr * cr - q * q, 1e-3))); } return 0; }
    case 'drill': case 'spot': case 'chamfer': case 'live_drill': return 1 / Math.tan(coneHalf(tool));
    default: return 0;
  }
}

/* ---------------- ФРЕЗЕРНАЯ: карта высот ---------------- */
class MillSim {
  constructor(stock, res, toolOf) {
    this.st = stock; this.toolOf = toolOf;
    const sx = stock.x1 - stock.x0, sy = stock.y1 - stock.y0;
    const cs = Math.max(sx, sy) / res;
    this.nx = Math.max(2, Math.round(sx / cs)); this.ny = Math.max(2, Math.round(sy / cs));
    this.dx = sx / this.nx; this.dy = sy / this.ny;
    this.W = this.nx + 1;
    this.H = new Float32Array((this.nx + 1) * (this.ny + 1));
    // круглая заготовка: узлы вне окружности — пустые (материала нет)
    this.mask = null;
    if (stock.shape === 'round' && stock.r > 0) {
      this.mask = new Uint8Array(this.H.length);
      const r2 = stock.r * stock.r;
      for (let j = 0; j <= this.ny; j++) for (let i = 0; i <= this.nx; i++) {
        const x = stock.x0 + i * this.dx - stock.cx, y = stock.y0 + j * this.dy - stock.cy;
        this.mask[j * this.W + i] = x * x + y * y <= r2 + 1e-9 ? 1 : 0;
      }
    }
    this.reset();
  }
  reset() {
    this.H.fill(this.st.z1); this.below = false; this.ver = (this.ver || 0) + 1;
    if (!this.T || this.T.length !== this.H.length) { this.T = new Int16Array(this.H.length); this.O = new Int16Array(this.H.length); }
    this.T.fill(-1); this.O.fill(-1);
    if (this.mask) for (let k = 0; k < this.H.length; k++) if (!this.mask[k]) this.H[k] = this.st.z0;
  }
  heightAt(x, y) {
    const i = Math.round((x - this.st.x0) / this.dx), j = Math.round((y - this.st.y0) / this.dy);
    if (i < 0 || j < 0 || i > this.nx || j > this.ny) return -1e9;
    if (this.mask && !this.mask[j * this.W + i]) return -1e9;
    return this.H[j * this.W + i];
  }
  stamp(x, y, z, tool) {
    const st = this.st, H = this.H, W = this.W;
    const r = Math.max(tool.d / 2, 0.71 * Math.max(this.dx, this.dy));
    const r2 = r * r;
    const i0 = Math.max(0, Math.ceil((x - r - st.x0) / this.dx)), i1 = Math.min(this.nx, Math.floor((x + r - st.x0) / this.dx));
    const j0 = Math.max(0, Math.ceil((y - r - st.y0) / this.dy)), j1 = Math.min(this.ny, Math.floor((y + r - st.y0) / this.dy));
    const type = tool.type, rt = tool.d / 2, cr = Math.min(tool.cr || 0, rt);
    const zb = st.z0;
    for (let j = j0; j <= j1; j++) {
      const ddy = st.y0 + j * this.dy - y, row = j * W;
      for (let i = i0; i <= i1; i++) {
        const ddx = st.x0 + i * this.dx - x, d2 = ddx * ddx + ddy * ddy;
        if (d2 > r2) continue;
        if (this.mask && !this.mask[row + i]) continue;
        let zt = z;
        if (type !== 'flat') zt = z + millProf(tool, Math.sqrt(d2));
        if (zt < zb) { zt = zb; this.below = true; }
        if (H[row + i] > zt + 1e-6) { H[row + i] = zt; this.T[row + i] = this.curT; this.O[row + i] = this.curO; }
      }
    }
  }
  stampMove(mv, l0, l1) {
    if (mv.k !== 'F' && mv.k !== 'T') return;
    const tool = this.toolOf(mv.t);
    this.curT = mv.t === null || mv.t === undefined ? 0 : mv.t; this.curO = mv.op || 0; this.ver++;
    walkMove(mv, l0, l1, Math.min(this.dx, this.dy) * 0.8, (x, y, z) => { if (z < this.st.z1) this.stamp(x, y, z, tool); });
  }
  clash(x, y, z, tool) {
    const st = this.st, r = tool.d / 2;
    const rr = Math.max(r - Math.max(this.dx, this.dy), 0);
    const test = (px, py, d) => {
      if (px < st.x0 - 1e-6 || px > st.x1 + 1e-6 || py < st.y0 - 1e-6 || py > st.y1 + 1e-6) return false;
      if (this.heightAt(px, py) < -1e8) return false;
      return z + millProf(tool, d) < this.heightAt(px, py) - 0.02 - Math.max(this.dx, this.dy) * millSlope(tool, d);
    };
    if (test(x, y, 0)) return true;
    if (rr <= 0) return false;
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4;
      if (test(x + rr * Math.cos(a), y + rr * Math.sin(a), rr)) return true;
      if (k % 2 === 0 && test(x + rr * 0.5 * Math.cos(a), y + rr * 0.5 * Math.sin(a), rr * 0.5)) return true;
    }
    return false;
  }
  rapidClash(mv) {
    const tool = this.toolOf(mv.t);
    let hit = null;
    walkMove(mv, 0, mv.cl[mv.cl.length - 1], Math.min(this.dx, this.dy), (x, y, z) => {
      if (!hit && z < this.st.z1 && this.clash(x, y, z, tool)) hit = [x, y, z];
    });
    return hit;
  }
}

/* ---------------- ТОКАРНАЯ: профиль заготовки ---------------- */
class LatheSim {
  constructor(stock, toolOf) {
    this.st = stock; this.toolOf = toolOf;
    this.dz = stock.len > 300 ? 0.1 : 0.05;
    this.n = Math.ceil(stock.len / this.dz) + 1;
    this.Ro = new Float32Array(this.n); this.Ri = new Float32Array(this.n);
    this.reset();
  }
  reset() { this.Ro.fill(this.st.dia / 2); this.Ri.fill(this.st.bore / 2); }
  idx(z) { return Math.round((this.st.zFace - z) / this.dz); }
  toolLen(tool) {
    switch (tool.type) { case 'groove': return tool.w || 3; case 'thread': return 1; case 'drill': return (tool.d / 2) / Math.tan(coneHalf(tool)); default: return tool.len || 10; }
  }
  cut(x, z, tool) {
    const r = Math.abs(x) / 2, n = this.n, Ro = this.Ro, Ri = this.Ri;
    const iHi = this.idx(z), iLo = this.idx(z + this.toolLen(tool));
    const a = Math.max(0, iLo), b = Math.min(n - 1, iHi);
    if (tool.type === 'int') { for (let i = a; i <= b; i++) if (r < Ro[i] && Ri[i] < r) Ri[i] = r; }
    else if (tool.type === 'drill') { const R = tool.d / 2, tn = Math.tan(coneHalf(tool)); for (let i = a; i <= b; i++) { const zi = this.st.zFace - i * this.dz, v = Math.min(R, Math.max(0, (zi - z)) * tn, Ro[i]); if (Ri[i] < v) Ri[i] = v; } }
    else { for (let i = a; i <= b; i++) if (r > Ri[i] && Ro[i] > r) Ro[i] = r; }
  }
  stampMove(mv, l0, l1) {
    if (mv.k !== 'F' && mv.k !== 'T') return;
    let tool = this.toolOf(mv.t);
    if (mv.live) {

/* Полный прогон: столкновения быстрых ходов, выход за заготовку, итоговое состояние */

  let snap = null, firstLive = -1;
  const lf = [], lfSeen = new Set(), neck = [], neckSeen = new Set();
  for (let mi = 0; mi < moves.length; mi++) {
    const mv = moves[mi];
    if (lathe && mv.live) {
      if (firstLive < 0) firstLive = mi;
      if (mv.k === 'F' || mv.k === 'T') sim.stampMove(mv, 0, mv.cl[mv.cl.length - 1]);
      continue;
    }
    if (mv.k === 'R') {
      if (hits.length < 40) {
        const h = sim.rapidClash(mv);
        if (h && !seenLine.has(mv.line)) { seenLine.add(mv.line); hits.push({ mi, line: mv.line, p: h }); }

/* ориентация инструмента (ось от вершины к шпинделю) в точке движения */

  if (!mv.dirs) return null;

/* ================================================================

/* Заготовка-тело вращения из профиля (после точения) для живого инструмента */
function dexelFromProfile(st, snap, res, toolOf) {
  const R = st.dia / 2 + 0.5;
  const box = { x0: -R, x1: R, y0: -R, y1: R, z0: st.zFace - st.len, z1: st.zFace };
  const n = snap.Ro.length, dz = snap.dz;
  const init = (x, y) => {
    const rho = Math.hypot(x, y), out = [];
    let inside = false, start = 0;
    for (let i = n - 1; i >= 0; i--) {                       // от дальнего торца к рабочему
      const ok = rho <= snap.Ro[i] && rho >= snap.Ri[i];
      const z = st.zFace - i * dz;
      if (ok && !inside) { inside = true; start = z - dz / 2; }
      else if (!ok && inside) { inside = false; out.push(Math.max(start, box.z0), z + dz / 2); }
    }
    if (inside) out.push(Math.max(start, box.z0), st.zFace + dz / 2);
    return out;
  };
  return new DexelSim(box, res, toolOf, init);
}

/* Заготовка-цилиндр токарной для полной 3D-модели (точение + живой инструмент) */
function dexelCylinder(st, res, toolOf) {
  const R = st.dia / 2, Rb = (st.bore || 0) / 2;
  const box = { x0: -R - 0.5, x1: R + 0.5, y0: -R - 0.5, y1: R + 0.5, z0: st.zFace - st.len, z1: st.zFace };
  const init = (x, y) => { const r = Math.hypot(x, y); return (r <= R && r >= Rb) ? [box.z0, box.z1] : []; };
  return new DexelSim(box, res, toolOf, init, true);
}

/* Проход по всей программе токарной в 3D: быстрые ходы живого инструмента проверяются на столкновение */
function analyzeLathe3D(moves, dex) {
  dex.reset();
  const hits = [], seen = new Set();
  for (let mi = 0; mi < moves.length; mi++) {
    const mv = moves[mi];
    if (mv.k === 'R') {
      if (mv.live && hits.length < 40) { const h = dex.rapidClash(mv); if (h && !seen.has(mv.line)) { seen.add(mv.line); hits.push({ mi, line: mv.line, p: h }); } }
    } else if (mv.k === 'F' || mv.k === 'T') dex.stampMove(mv, 0, mv.cl[mv.cl.length - 1]);
  }
  return hits;
}

MillView.gidSeq = 0;

    if (this.hover) {
      const hz = (this.hover[0] - ox) / sc, hr = (oy - this.hover[1]) / sc;
      ctx.fillStyle = THEME.fg; ctx.textBaseline = 'bottom';
      ctx.fillText('Z ' + hz.toFixed(2) + '   X ⌀' + (Math.abs(hr) * 2).toFixed(2), 8, H - 6);
    }
  }
  drawPaths(ctx, SX, SY, pb) {
    const moves = this.moves, o = this.opts;
    const cur = pb ? pb.idx : moves.length, fr = pb ? pb.frac : 1;
    const groups = new Map();
    const add = (key, st, m, a, b) => { let g = groups.get(key); if (!g) { g = { st, l: [] }; groups.set(key, g); } g.l.push(m, a, b); };
    for (let i = 0; i < moves.length; i++) {
      const m = moves[i];
      if (m.k === 'C' || m.k === 'D') continue;
      const rap = m.k === 'R';
      if (rap ? !o.rapid : !o.feed) continue;
      const col = rap ? THEME.rapid : (m.k === 'T' ? THEME.thread : this.toolColor(m.t));
      const state = i < cur ? 2 : (i === cur ? 1 : 0);
      if (state === 2) add('n' + col + rap, { col, rap, dim: false }, m, 0, 1);
      else if (state === 0) add('d' + col + rap, { col, rap, dim: true }, m, 0, 1);
      else { add('n' + col + rap, { col, rap, dim: false }, m, 0, fr); add('d' + col + rap, { col, rap, dim: true }, m, fr, 1); }
    }
    for (const [, g] of groups) {
      ctx.globalAlpha = g.st.dim ? 0.25 : 1; ctx.strokeStyle = g.st.col; ctx.lineWidth = g.st.rap ? 1.1 : 1.8;
      ctx.setLineDash(g.st.rap ? [5, 4] : []); ctx.beginPath();
      for (let k = 0; k < g.l.length; k += 3) {
        const m = g.l[k], a = g.l[k + 1], b = g.l[k + 2], tot = m.cl[m.cl.length - 1];
        const la = tot * a, lb = tot * b;
        let started = false;
        for (let q = 0; q < m.pts.length; q++) {
          const p = m.pts[q], lq = m.cl[q];
          if (q > 0 && lq <= la) continue;
          if (!started) {
            if (q > 0) { const pp = m.pts[q - 1], l0 = m.cl[q - 1], t = lq > l0 ? (la - l0) / (lq - l0) : 0; ctx.moveTo(SX(pp[2] + (p[2] - pp[2]) * t), SY(Math.abs(pp[0] + (p[0] - pp[0]) * t) / 2)); }
            else ctx.moveTo(SX(p[2]), SY(Math.abs(p[0]) / 2));
            started = true;
          }
          if (lq > lb) { const pp = m.pts[q - 1], l0 = m.cl[q - 1], t = lq > l0 ? (lb - l0) / (lq - l0) : 0; ctx.lineTo(SX(pp[2] + (p[2] - pp[2]) * t), SY(Math.abs(pp[0] + (p[0] - pp[0]) * t) / 2)); break; }
          ctx.lineTo(SX(p[2]), SY(Math.abs(p[0]) / 2));
        }
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.setLineDash([]);
  }
  drawTool(ctx, SX, SY, sc, pb) {
    const z = pb.pos[2], r = Math.abs(pb.pos[0]) / 2, tool = this.toolOf(pb.tool);
    let poly;
    switch (tool.type) {
      case 'int': poly = [[0, 0], [9, 0], [9, -6], [1.2, -6]]; break;
      case 'groove': { const w = tool.w || 3; poly = [[0, 0], [w, 0], [w, 8], [0, 8]]; break; }
      case 'thread': poly = [[0, 0], [1.2, 0.7], [7, 0.7], [7, 6], [-1.2, 0.7]]; break;
      case 'drill': { const R = tool.d / 2, hc = R / Math.tan(coneHalf(tool)); poly = [[0, 0], [hc, R], [hc + 22, R], [hc + 22, -R], [hc, -R]]; break; }
      case 'live_ax': { const R = tool.d / 2; poly = [[0, -R], [0, R], [22, R], [22, -R]]; break; }
      case 'live_drill': { const R = tool.d / 2, hc = R / Math.tan(coneHalf(tool)); poly = [[0, 0], [hc, R], [hc + 22, R], [hc + 22, -R], [hc, -R]]; break; }
      case 'live_rad': { const R = tool.d / 2; poly = [[-R, 0], [R, 0], [R, 18], [-R, 18]]; break; }
      default: poly = [[0, 0], [8, 0], [8, 6], [1.2, 6]];
    }
    ctx.fillStyle = THEME.accent; ctx.globalAlpha = 0.6; ctx.strokeStyle = THEME.fg; ctx.lineWidth = 1.2;
    ctx.beginPath();
    poly.forEach((p, i) => { const x = SX(z + p[0]), y = SY(r + p[1]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1; ctx.stroke();
    ctx.fillStyle = THEME.fg; ctx.beginPath(); ctx.arc(SX(z), SY(r), 3, 0, 6.3); ctx.fill();
  }
}

    const log = (t, cls) => { const L = back.querySelector('.mdl-log'); const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = t; L.appendChild(d); L.scrollTop = L.scrollHeight; };
    function close() { if (busy) return; if (back) back.remove(); back = null; }
    async function open() {
      info = await window.cncLink.info();
      const name = progNameOf(), nonAscii = (code.value.match(/[^\x00-\x7E]/g) || []).length;
      back = document.createElement('div'); back.className = 'mdl-back';
      const mi = defMachine();
      const opts = info.machines.map((m, i) => '<option value="' + i + '"' + (i === mi ? ' selected' : '') + '>' + esc(m.name) + ' — ' + esc(m.ip) + ':' + m.port + '</option>').join('');
      back.innerHTML = '<div class="mdl" role="dialog" aria-label="Отправка на станок"><div class="mdl-h"><b>Отправка УП на станок</b><span class="mdl-note">' + esc(name) + '</span><button class="x" data-a="close" aria-label="Закрыть">×</button></div>' +
        '<div class="mdl-b">' +
        (info.machines.length ? '<div class="mdl-row"><label>Станок</label><select data-k="m">' + opts + '</select></div>' :
          '<div class="mdl-warn">Список станков не найден. Он берётся из STZ &amp; FANUC LAN: ' + esc(info.stzDir) + '\\ptt_settings.json. Укажите папку программы кнопкой ниже.</div>') +
        '<div class="mdl-row"><label>Папка на стойке</label><div class="mdl-in"><input data-k="f" spellcheck="false"><button class="btn" data-a="browse"' + (info.machines.length && info.dllOk ? '' : ' disabled') + '>Обзор…</button></div></div><div class="mdl-br" hidden></div>' +
        '<div class="mdl-note">Стойка в режиме EDIT, ключ защиты памяти открыт. Список станков и их IP — общий с STZ &amp; FANUC LAN.</div>' +
        (nonAscii ? '<div class="mdl-warn">В тексте ' + nonAscii + ' символ(ов) не латиницей (например, русские буквы в комментариях) — при отправке они заменятся на «?».</div>' : '') +
        (info.dllOk ? '' : '<div class="mdl-warn">Не найдена библиотека FOCAS (Fwlib64.dll) — переустановите программу.</div>') +
        '<div class="mdl-bar"><i></i></div><div class="mdl-log"></div></div>' +
        '<div class="mdl-f"><button class="btn" data-a="stz" title="Сохранить УП в папку и открыть её в STZ & FANUC LAN">Открыть в STZ &amp; FANUC LAN</button><button class="btn" data-a="dir" title="Где лежит STZ_FANUC_LAN и ptt_settings.json">Папка STZ…</button><span class="grow"></span><button class="btn" data-a="close">Закрыть</button><button class="btn primary" data-a="send"' + (info.machines.length && info.dllOk ? '' : ' disabled') + '>Отправить</button></div></div>';
      document.body.appendChild(back);
      const sel = back.querySelector('[data-k=m]'), fin = back.querySelector('[data-k=f]');
      const folderFor = i => { const m = info.machines[i]; return (m && info.folders[m.name]) || '//CNC_MEM/USER/PATH1/'; };
      fin.value = folderFor(mi);
      if (sel) sel.onchange = () => { fin.value = folderFor(+sel.value); const br = back.querySelector('.mdl-br'); br.hidden = true; br.innerHTML = ''; };
      log(info.stzExe ? 'STZ & FANUC LAN: ' + info.stzExe : 'STZ & FANUC LAN не найден в ' + info.stzDir);
      back.addEventListener('click', e => { if (e.target === back) close(); const a = e.target.closest('[data-a]'); if (!a) return; const act = a.dataset.a;
        if (act === 'close') close();
        else if (act === 'send') doSend(false);
        else if (act === 'stz') doStz();
        else if (act === 'browse') { const br = back.querySelector('.mdl-br'); if (br.hidden) { br.hidden = false; const f = back.querySelector('[data-k=f]').value.trim(); brGo(/^\/\/[^/]+\//.test(f) ? f : ''); } else br.hidden = true; }
        else if (act === 'br-up') { const p = brPath.replace(/\/$/, ''); const i = p.lastIndexOf('/'); brGo(i > 1 ? p.slice(0, i + 1) : ''); }
        else if (act === 'br-ok') { if (brPath) { back.querySelector('[data-k=f]').value = brPath; back.querySelector('.mdl-br').hidden = true; log('Папка выбрана: ' + brPath); } }
        else if (act === 'br-go') brGo(a.dataset.p);
        else if (act === 'br-re') brGo(brPath);
        else if (act === 'dir') window.cncLink.pickStzDir().then(d => { if (d) { close(); open(); } });
      });
    }
    let brPath = '', brBusy = false;
    async function brGo(path) {
      if (brBusy) return; const br = back.querySelector('.mdl-br'), sel = back.querySelector('[data-k=m]');
      const m = info.machines[+sel.value]; if (!m) return;
      brBusy = true;
      br.innerHTML = '<div class="mdl-br-h"><code>' + esc(path || m.name) + '</code></div><div class="mdl-br-l"><div class="msg2">Чтение со стойки ' + esc(m.ip) + '…</div></div>';
      const r = await window.cncLink.browse({ ip: m.ip, port: m.port, path: path || '' });
      brBusy = false; if (!back) return;
      if (!r.ok) { br.innerHTML = '<div class="mdl-br-h"><code>' + esc(path || m.name) + '</code><button class="btn" data-a="br-re">Повторить</button></div><div class="mdl-br-l"><div class="msg2" style="color:var(--bad)">' + esc(r.error) + '</div></div>'; return; }
      brPath = path || '';
      if (path) back.querySelector('[data-k=f]').value = path; // папка в обзоре = папка отправки
      const pn = progNameOf(); let rows = '';
      if (!path) {
        rows = r.drives.map(d => '<div class="it d" data-a="br-go" data-p="//' + esc(d) + '/"><span>💾</span><span>' + esc(d) + '</span><small></small></div>').join('');
        if (r.derr) rows += '<div class="msg2">Список дисков не прочитан: ' + esc(r.derr) + '</div>';
      } else {
        const ds = r.entries.filter(e => e.isDir), fs2 = r.entries.filter(e => !e.isDir);
        rows = ds.map(e => '<div class="it d" data-a="br-go" data-p="' + esc(path + e.name + '/') + '"><span>📁</span><span>' + esc(e.name) + '</span><small>' + esc(e.comment) + '</small></div>').join('') +
          fs2.map(e => '<div class="it f' + (e.name.toUpperCase() === pn ? ' same' : '') + '" title="' + esc(e.date) + '"><span>📄</span><span>' + esc(e.name) + ' <small>' + esc(e.comment) + '</small></span><small>' + (e.size >= 1024 ? (e.size / 1024).toFixed(1) + ' КБ' : e.size + ' Б') + '</small></div>').join('');
        if (!rows) rows = '<div class="msg2">Папка пустая</div>';
        if (fs2.some(e => e.name.toUpperCase() === pn)) rows = '<div class="msg2" style="color:var(--warn)">' + esc(pn) + ' уже есть в этой папке — при отправке будет предложена замена.</div>' + rows;
      }
      br.innerHTML = '<div class="mdl-br-h"><button class="btn" data-a="br-up" title="Вверх"' + (path ? '' : ' disabled') + '>↑</button><code>' + esc(path || m.name + ' — диски стойки') + '</code><button class="btn" data-a="br-re" title="Обновить">⟳</button><button class="btn primary" data-a="br-ok"' + (path ? '' : ' disabled') + '>Готово</button></div><div class="mdl-br-l">' + rows + '</div>';
    }
    async function doSend(replace) {
      const sel = back.querySelector('[data-k=m]'), fin = back.querySelector('[data-k=f]');
      const m = info.machines[+sel.value]; let folder = fin.value.trim().replace(/\\/g, '/').replace(/^\/*/, '//').replace(/([^/])\/{2,}/g, '$1/'); if (folder === '//') return;
      if (!folder.endsWith('/')) folder += '/'; fin.value = folder;
      const folders = Object.assign({}, info.folders, { [m.name]: folder }); info.folders = folders;
      window.cncLink.saveCfg({ machineIndex: +sel.value, folders });
      const bar = back.querySelector('.mdl-bar i'); bar.style.width = '0';
      busy = true; back.querySelectorAll('button').forEach(b => b.disabled = true);
      window.cncLink.onProgress(p => { if (p.msg) log(p.msg); if (p.total) bar.style.width = (100 * p.done / p.total).toFixed(1) + '%'; });
      log('→ ' + progNameOf() + ' → ' + m.name + ' (' + m.ip + ')  ' + folder);
      const r = await window.cncLink.send({ ip: m.ip, port: m.port, folder, text: code.value, name: progNameOf(), replace });
      busy = false; back.querySelectorAll('button').forEach(b => b.disabled = false);
      if (r.ok) { bar.style.width = '100%'; if (r.added) log('В программе не было номера — добавлен заголовок ' + r.added); log('✔ ' + (r.cncName || '') + ' записана на станок (' + r.bytes + ' байт)', 'ok'); }
      else if (r.exists) {
        log('На станке в ' + folder + ' уже есть ' + r.cncName + '.');
        if (confirm('На станке уже есть ' + r.cncName + ' в папке ' + folder + '.\n\nЗаменить её этой программой?')) doSend(true); else log('Отправка отменена');
      } else log('✖ ' + r.error, 'bad');
    }
    async function doStz() {
      const r = await window.cncLink.openStz({ text: code.value, name: progNameOf() });
      if (r.ok) log('УП сохранена: ' + r.file + '\nSTZ & FANUC LAN откроется в этой папке', 'ok'); else log('✖ ' + r.error, 'bad');
    }
    btn.onclick = () => { if (!back) open(); };
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && back) close(); });
  })();
  $('btnCopy').onclick = async () => {
    const b = $('btnCopy'), old = b.textContent;
    let ok = false;
    try { await navigator.clipboard.writeText(code.value); ok = true; } catch (e) { }
    if (!ok) { try { code.focus(); code.select(); ok = document.execCommand('copy'); } catch (e) { } }
    b.textContent = ok ? 'Скопировано' : 'Выделено: Ctrl+C'; setTimeout(() => { b.textContent = old; }, 1600);
  };
  if ($('btnSave')) $('btnSave').onclick = () => {
    try {
      const m = /^\s*%?\s*\n?\s*(O\d+)/m.exec(code.value);
      const blob = new Blob([code.value], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (m ? m[1] : 'program') + '.nc';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (err) { }
  };
  function applyTheme() {
    const r = document.documentElement;
    if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
    $('btnTheme').textContent = 'Тема: ' + ({ auto: 'авто', light: 'светлая', dark: 'тёмная' }[S.theme]);
    refreshTheme(); needRender = true;
  }
  $('btnTheme').onclick = () => { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; persist(); applyTheme(); };
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { refreshTheme(); needRender = true; });

  /* ---------- старт ---------- */
  applyTheme();
  setMode(S.mode, true);
  onCaret();
  requestAnimationFrame(frame);
  window.__gsim = { S, get res() { return res; }, pb, rebuild, setMode, loadExample, get tl() { return tl; }, get sim() { return sim; }, mill, lathe, step, draw: () => { needRender = true; } };
})();


</script>
